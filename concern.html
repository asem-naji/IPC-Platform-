<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact IPC | Al-Sobh Hospital</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--sun:#F2C300;--ink:#2E3E47;--paper:#F3F8F8;--line:#CADCDD;--muted:#4F6670;--primary:#245E68;--go:#1E7B4F;--go-bg:#E5F3EC;--stop:#B42318;--stop-bg:#FBEAE8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
header{background:#fff;border-bottom:4px solid var(--sun);text-align:center;padding:14px 16px 10px}
header img{height:50px;max-width:80%}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.4rem;margin:6px 0 2px}.lead2{color:var(--muted);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:1.05rem;margin:0 0 6px;color:var(--primary)}
label{display:block;font-weight:700;margin:12px 0 4px}label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1 1 220px}
.hint{color:var(--muted);font-size:.86rem;margin:4px 0 0}
.warn{background:#FFF6DB;border:1px solid #E9C877;border-radius:10px;padding:10px 12px;font-size:.9rem;margin-top:10px}
.bad{border-color:var(--stop)!important}
.err{background:var(--stop-bg);color:var(--stop);border-radius:10px;padding:10px 12px;margin:12px 0;font-weight:600}
.btn{display:block;width:100%;background:var(--primary);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.btn[disabled]{opacity:.6}
.addph{display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--primary);color:var(--primary);background:#fff;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:800;cursor:pointer}
.ok{background:var(--go-bg);border:1px solid #A9D5BD;border-radius:14px;padding:18px;text-align:center}
.ok b{font-size:1.4rem;color:var(--go);display:block;margin-bottom:6px}
.ref{font-family:ui-monospace,Consolas,monospace;font-size:1.3rem;letter-spacing:2px;background:#fff;border-radius:8px;padding:6px 12px;display:inline-block;margin:8px 0}
.hp{position:absolute;left:-9999px}
.req{color:var(--stop)}
.hero{background:linear-gradient(135deg,#245E68,#2E7D8A);color:#fff;border-radius:16px;padding:18px 18px 16px;margin:4px 0 14px}
.hero h1{color:#fff;margin:0;font-size:1.5rem}
.herotop{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:10px;text-align:center}.ipc4all{width:150px;height:150px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.hero p{text-align:center}.hero .promise{justify-content:center}.hero p{margin:0;opacity:.95}
.promise{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.promise span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 12px;font-size:.86rem;font-weight:600}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:10px}
header.dual{background:#fff;border-bottom:4px solid #F2C300;display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 16px}
header.dual .hl{height:54px;max-width:46vw;object-fit:contain}header.dual .il{height:78px;max-width:30vw;object-fit:contain}
header.dual .sep{width:2px;align-self:stretch;margin:8px 0;background:#CADCDD}
@media(max-width:380px){header.dual .hl{height:44px}header.dual .il{height:64px}}
</style></head><body>

    <div class="row"><div><label for="rn">Name</label><input id="rn" data-k="reporter" maxlength="80" value="${esc(F.reporter)}"></div>
    <div><label for="re">Employee number</label><input id="re" data-k="empId" inputmode="numeric" maxlength="8" value="${esc(F.empId)}" class="${bad.includes("empId")?"bad":""}"></div></div>
    <p class="hint">Leave these empty to send without your name. Add them only if you would like us to get back to you.</p></div>
  <p class="hint" style="margin:0 2px 12px">For incidents or injuries to staff or patients, use the hospital incident reporting system.</p>
  <input class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" data-k="website" value="">
  ${err?`<div class="err" role="alert">${err}</div>`:""}
  <button class="btn" id="send" ${busy?"disabled":""}>${busy?"Sending…":"Send to IPC"}</button>`;
  document.querySelectorAll("[data-k]").forEach(el=>{el.oninput=el.onchange=()=>{let v=el.value;if(el.dataset.k==="empId"){v=en(v).replace(/\D/g,"");if(v!==el.value)el.value=v;}F[el.dataset.k]=v;
    if(bad.includes(el.dataset.k)){bad=bad.filter(k=>k!==el.dataset.k);el.classList.remove("bad");if(!bad.length){err="";$(".err")?.remove();}}if(el.tagName==="SELECT")render();};});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{photos.splice(+b.dataset.rm,1);render();});
  const cp=$("#cp");if(cp)cp.onchange=async()=>{const fs=[...cp.files].slice(0,MAXPH-photos.length);for(const f of fs){try{photos.push(await shrink(f));}catch(_){err="One photo could not be read. Try another photo.";}}render();};
  $("#send").onclick=send;
}
function check(){bad=[];const t=k=>String(F[k]||"").trim();
  if(!LOCS.includes(F.dept))bad.push("dept");if(F.dept==="Other"&&t("deptOther").length<2)bad.push("deptOther");
  if(t("text").length<3)bad.push("text");if(t("empId")&&!/^\d{8}$/.test(t("empId")))bad.push("empId");
  const n={dept:"the location",deptOther:"which location",text:"what you noticed",empId:"the employee number (8 digits) or leave it empty"};
  return bad.length?`Please complete: ${bad.map(k=>n[k]).join(", ")}.`:"";}
async function send(){if(busy)return;err=check();if(err){render();return;}
  if(F.website){done="OK";render();return;}
  if(!db){err="The form is not connected. Please contact the Infection Prevention and Control team.";render();return;}
  busy=true;render();
  try{const t=k=>String(F[k]||"").trim(),ref=db.collection("concerns").doc(),b=db.batch(),ids=[],ts=firebase.firestore.FieldValue.serverTimestamp();
    photos.forEach(p=>{const pr=db.collection("concernPhotos").doc();ids.push(pr.id);b.set(pr,{id:pr.id,concernId:ref.id,data:p,ts});});
    const d={id:ref.id,dept:F.dept,spot:t("spot"),text:t("text"),photoIds:ids,submitted:new Date().toISOString(),state:"New",ts};
    if(F.dept==="Other")d.deptOther=t("deptOther");if(t("reporter"))d.reporter=t("reporter");if(t("empId"))d.empId=t("empId");
    b.set(ref,d);
    await Promise.race([b.commit(),new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),30000))]);
    done=ref.id.slice(-6).toUpperCase();busy=false;err="";render();scrollTo(0,0);
  }catch(e){busy=false;err=e&&e.code==="permission-denied"?"The report was refused. Check the details and try again.":"Could not send. Check the internet connection and try again.";render();}}
const load=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});
(async()=>{document.getElementById("yy").textContent=new Date().getFullYear();render();const cfg=window.IPC_CONFIG?.firebase;if(!cfg?.apiKey)return;
  try{const V="10.12.2";await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
    db=firebase.initializeApp(cfg,"concern").firestore();}catch(e){err="Could not load the form. Check the internet connection and reload the page.";render();}})();
</script></body></html>
