<style>
:root{
  /* Al-Sobh identity: mist from the brand colour, slate and sunrise gold from the logo */
  --mist:#D4E9E9; --sun:#F2C300; --ink:#2E3E47; --paper:#F3F8F8; --surface:#FFFFFF; --line:#CADCDD; --muted:#4F6670; --primary:#245E68;
  --go:#1E7B4F; --go-bg:#E5F3EC; --stop:#B42318; --stop-bg:#FBEAE8; --na:#6B7A84; --warn-bg:#FFF6DB;
  --hh:#0F6E8C; --ppe:#5B4B9A; --waste:#C98A00; --env:#B5543A; --bundle:#8A9AA3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.wrap.wide{max-width:1120px}
/* header: the logo's horizon bar becomes a gold line under the band */
header.bar{background:var(--mist);color:var(--ink);border-bottom:3px solid var(--sun)}
header.bar .wrap{padding:10px 16px;display:flex;flex-direction:row-reverse;align-items:center;gap:12px;justify-content:space-between;max-width:1120px}

.who{font-size:.85rem;text-align:left;line-height:1.3}
.who button{background:rgba(255,255,255,.6);border:1px solid rgba(46,62,71,.3);color:var(--ink);border-radius:6px;padding:3px 9px;margin-top:4px;font-size:.8rem}

/* sign-in gate */
.gate{position:relative;overflow:hidden;background:var(--mist);border-bottom:3px solid var(--sun)}
.gate-sun{--o:.32;position:absolute;left:-90px;top:-40px;width:380px;opacity:var(--o);pointer-events:none}

.gate h1{font-size:1.9rem;letter-spacing:-.01em;margin:0 0 6px}
.gate p.lead{margin:0;color:#3E5560}
.gate-card{position:relative;z-index:1;margin-top:-44px;box-shadow:0 10px 30px -12px rgba(36,94,104,.35)}
@media (prefers-reduced-motion:no-preference){.gate-sun{animation:rise 1.2s ease-out both}@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:var(--o)}}}
/* footer and ownership */
.foot{max-width:1120px;margin:0 auto;padding:18px 16px 84px;color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)}

.role{display:inline-block;margin-top:2px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:700}

h1{font-size:1.6rem;line-height:1.2;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:1.18rem;margin:28px 0 8px}
h3{font-size:1rem;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
.crumb{display:flex;gap:6px;flex-wrap:wrap;font-size:.9rem;margin:4px 0 8px}
.crumb button,.link-btn{background:none;border:none;padding:0;color:var(--primary);text-decoration:underline}
.crumb span{color:var(--muted)}
.tiles{display:grid;gap:10px}

@media (min-width:600px) and (max-width:899px){.tiles.grid{grid-template-columns:1fr 1fr}}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--primary));border-radius:8px;padding:16px}
.tile b{display:block;font-size:1.08rem}
.tile span{color:var(--muted);font-size:.9rem}
.tile[disabled]{opacity:.55;cursor:default}
.tile .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.tile .alert{color:var(--stop);font-weight:700}
label.f{display:block;font-weight:700;margin:16px 0 6px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{display:inline-block;border:none;border-radius:8px;padding:13px 18px;font-weight:700;background:var(--primary);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid #E7B9B4}
.btn.small{padding:7px 12px;font-size:.88rem}
.btn.block{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.hint{color:var(--muted);font-size:.88rem;margin-top:6px}
.err{color:var(--stop);font-size:.92rem;margin-top:10px}
.draft{background:var(--warn-bg);border:1px solid #EBCB6B;border-radius:8px;padding:10px 12px;font-size:.88rem;margin:12px 0}

.zone{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.zone .pz{grid-column:2;grid-row:2;border:2px dashed var(--hh);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--hh);font-weight:700;min-height:92px;padding:6px;background:#EAF4F7}

.mom[aria-pressed=true]{background:var(--hh);border-color:var(--hh);color:#fff}

.m1{grid-column:1;grid-row:2}.m2{grid-column:2;grid-row:1}.m3{grid-column:3;grid-row:1}.m4{grid-column:3;grid-row:2}.m5{grid-column:3;grid-row:3}

.yn{border-top:1px solid var(--line);padding:12px 0}

.yn button.n[aria-pressed=true]{background:var(--stop);border-color:var(--stop);color:#fff}

.photos{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.thumb{position:relative}

.file-btn{position:relative;overflow:hidden}

.tally{position:sticky;bottom:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--go);color:#fff;padding:12px 18px;border-radius:8px;font-weight:700;z-index:20}
.toast.bad{background:var(--stop)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.stat small{display:block;font-size:.78rem;color:var(--muted)}
.stat .met{color:var(--go);font-weight:700;font-size:.8rem}
.stat .miss{color:var(--stop);font-weight:700;font-size:.8rem}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.charts{grid-template-columns:1fr}}
.chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
.chart svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#E6F1F1;white-space:nowrap}
td.c{text-align:center;font-variant-numeric:tabular-nums}
td.c small{display:block;color:var(--muted);font-size:.75rem}
td.good{background:var(--go-bg)} td.bad{background:var(--stop-bg)} td.none{color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--go-bg);color:var(--go)} .tag.no{background:var(--stop-bg);color:var(--stop)} .tag.mid{background:var(--warn-bg);color:#7A5600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row > *{flex:1;min-width:160px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.fails{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.fails{grid-template-columns:1fr}}
.fails ol{margin:6px 0 0;padding-left:20px;font-size:.9rem}
.fails li{margin-bottom:4px}
.action{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:14px;margin-bottom:10px}
.action.over{border-left-color:var(--stop)}
.action p{margin:4px 0}
.modal{position:fixed;inset:0;background:rgba(16,41,59,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal .inner{background:#fff;border-radius:10px;padding:12px;width:min(94vw,960px);max-height:90vh;overflow:auto}
.modal .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.modal img{width:100%;border-radius:6px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.mom{font-size:.8rem;padding:8px 6px}}
.pt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.bedno{flex:0 0 64px;height:64px;border-radius:10px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bedno b.long{font-size:.95rem;text-align:center}
.scanbox{background:#EAF4F7;border:1px solid #BFDCE5;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.scanbox .row{margin-top:8px}
.filled{border-color:#1E7B4F!important;box-shadow:0 0 0 2px #E5F3EC}
.bedno small{font-size:.7rem;opacity:.75}.bedno b{font-size:1.5rem}
.meta{color:var(--muted);font-size:.88rem;font-weight:400}
.pt .meta{display:block}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;border:1.5px solid var(--c);border-left-width:6px}
.pill.done{background:var(--go-bg);color:var(--go)} .pill.due{background:#fff;color:var(--stop)} .pill.watch{background:var(--warn-bg);color:#7A5600} .pill.none{border-color:var(--line);color:var(--muted)}
.dev{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:14px;margin-bottom:10px}
.dev p{margin:4px 0}
.subs{margin:10px 0 2px;padding:10px 12px;background:var(--stop-bg);border-radius:8px}
.subs p{margin:0 0 8px;font-size:.88rem;font-weight:700;color:var(--stop)}
.subs .chip{padding:7px 12px;font-size:.88rem}
.subs .chip[aria-pressed=true]{background:var(--stop);border-color:var(--stop);color:#fff}
.envgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px}
.envx{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:11px 12px;text-align:left;font-size:.92rem;line-height:1.3}
.envx small{display:block;font-size:.75rem;color:var(--go);font-weight:700;margin-top:2px}
.envx[aria-pressed=true]{background:var(--stop);border-color:var(--stop);color:#fff}
.envx[aria-pressed=true] small{color:#fff}
.envx.na{background:#EDF1F3;border-style:dashed;color:var(--na)}
.envx.na span{text-decoration:line-through}
.envx.na small{color:var(--na)}
.rm{position:absolute;bottom:9px;right:10px;font-size:.75rem;color:var(--stop);text-decoration:underline;background:none;border:none;padding:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:6px 0 2px}
.pill.adh{background:#fff;color:#7A5600;border-style:dashed}
.bench input{padding:8px;min-width:70px}
.bench th,.bench td{vertical-align:middle}
td.c.tgt{font-weight:700}
/* assistant */
.ai-fab{position:fixed;right:18px;bottom:18px;z-index:30;width:62px;height:62px;border-radius:50%;background:var(--primary);color:#fff;border:3px solid var(--sun);box-shadow:0 12px 28px -10px rgba(36,94,104,.6);display:grid;place-items:center}
.ai-fab:hover{transform:translateY(-1px)}
.ai-panel{position:fixed;right:16px;bottom:16px;z-index:31;width:min(430px,calc(100vw - 32px));height:min(640px,calc(100vh - 32px));background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 28px 70px -24px rgba(36,94,104,.55);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:700px){.ai-panel{right:0;left:0;bottom:0;width:100%;height:86vh;border-radius:18px 18px 0 0}}
.ai-head{background:var(--mist);border-bottom:3px solid var(--sun);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ai-head b{display:block;font-size:1.05rem}.ai-head small{display:block;color:var(--muted);font-size:.8rem}
.ai-x{width:36px;height:36px;border-radius:50%;border:1px solid rgba(46,62,71,.25);background:rgba(255,255,255,.7);font-size:1.3rem;line-height:1}
.ai-lang{border:1px solid rgba(46,62,71,.25);background:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.ai-log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.ai-empty p{color:var(--muted);margin:2px 0 10px;font-size:.92rem}
.ai-hint{display:block;width:100%;text-align:start;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.88rem;color:var(--ink)}
.ai-msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:.92rem;line-height:1.45;white-space:pre-wrap}

.ai-msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}

.ai-msg ul{margin:6px 0 0;padding-left:18px;white-space:normal;font-size:.86rem}
.ai-miss{margin:6px 0 0;color:#7A5600;font-size:.82rem;white-space:normal}
.ai-review{margin-top:8px;border:none;background:var(--mist);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:700;font-size:.85rem}
.ai-dots{display:flex;gap:5px}.ai-dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4}
@media (prefers-reduced-motion:no-preference){.ai-dots span{animation:blink 1s infinite}.ai-dots span:nth-child(2){animation-delay:.2s}.ai-dots span:nth-child(3){animation-delay:.4s}@keyframes blink{50%{opacity:1}}
  .ai-mic.on{animation:pulse 1.4s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.5)}70%{box-shadow:0 0 0 12px rgba(180,35,24,0)}100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}}}
.ai-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;background:#fff}
.ai-foot textarea{flex:1;resize:none;min-height:48px;max-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:.95rem}
.ai-mic,.ai-send{width:48px;height:48px;flex:0 0 48px;border-radius:50%;border:none;display:grid;place-items:center}
.ai-mic{background:var(--mist);color:var(--ink)}.ai-mic.on{background:var(--stop);color:#fff}
.ai-send{background:var(--primary);color:#fff}.ai-send:disabled{opacity:.5}
.foot{padding-right:96px}
.rep-head{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid var(--sun);padding-bottom:12px;margin-bottom:6px}
.rep-head img{height:58px}.rep-head h1{margin:0;font-size:1.45rem}.rep-head p{margin:4px 0 0;color:var(--muted)}
.rep section{break-inside:avoid-page}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}.sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:.85rem;color:var(--muted)}

  @page{size:A4;margin:14mm}

}
.alert-box{background:#FBEAE8;border:1px solid #F0B8B2;border-left:6px solid var(--stop);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.pill.long{background:#FFF1CC;border-color:#E3B341;color:#6B4A00}

.crit input{width:20px;height:20px;margin-top:2px;flex:0 0 20px}

<body>
<div id="app"></div>
<div id="ai-root"></div>
<script>
/* ================= Reference data ================= */
const DEPARTMENTS=["General Ward (3rd Floor)","ICU","Pediatric ICU","CCU","ER","Male Psychiatry","Female Psychiatry","General OPD","Psychiatry OPD","Day Care Unit","Laboratory","Radiology","Pharmacy","Isolation rooms","Other"];
const ISO_UNITS=["ER","ICU","CCU","Third floor"];
const OPD_SPECIALTIES=["Internal medicine","General surgery","Orthopedics","ENT","Pediatrics","Dietitian","Neurology","Other specialty"];
const rng=(a,b,p="")=>Array.from({length:b-a+1},(_,i)=>p+(a+i));
/* DRAFT: unit areas. Add or rename to match the hospital */
const WARD_AREAS=["Nurse station","Medication room","Clean utility","Dirty utility","Corridor","Equipment room","Medical waste collection room","Store"];
const LOC={
  "General Ward (3rd Floor)":{rooms:rng(300,380),areas:WARD_AREAS},
  "ICU":{rooms:rng(1,35,"Bed "),areas:WARD_AREAS},
  "Pediatric ICU":{rooms:rng(1,21,"Bed "),areas:WARD_AREAS},
  "CCU":{rooms:rng(1,7,"Bed "),areas:WARD_AREAS},
  "ER":{rooms:[...rng(1,3,"CPR "),...rng(1,12,"Observation "),...rng(1,6,"Fast track "),...rng(1,6,"Pediatric "),...rng(1,3,"Isolation ")],areas:["Respiratory area","Triage",...WARD_AREAS]},
  "Male Psychiatry":{rooms:"text",areas:WARD_AREAS},
  "Female Psychiatry":{rooms:"text",areas:WARD_AREAS},
  "Day Care Unit":{rooms:rng(1,9,"Bed "),areas:WARD_AREAS},
  "General OPD":{areas:["Clinic room","Waiting area","Treatment room","Nurse station","Dirty utility","Store"]},
  "Psychiatry OPD":{areas:["Clinic room","Waiting area","Nurse station","Dirty utility","Store"]},
  "Laboratory":{areas:["Microbiology","Hematology","Clinical chemistry","Blood bank","Sample collection","Reception"]},
  "Radiology":{areas:["X-ray room 1","X-ray room 2","CT room","MRI room","Ultrasound room","Waiting area","Dirty utility"]},
  "Pharmacy":{areas:["Inpatient pharmacy","Outpatient pharmacy","IV room"]},
  "Isolation rooms":{rooms:["ER isolation 1","ER isolation 2","ER isolation 3","ICU isolation 9","ICU isolation 10","ICU isolation 21","CCU isolation","Room 315","Room 317","Room 354","Room 355"]},
  "Other":{rooms:"text",areas:[]}};
const STAFF=["Nurse","Doctor","Housekeeping","Other"];
const ROLES={team:"Infection Control Team",link:"Infection Control Link"};
const MOMENTS=[

function changeNote(k,a,b){
  if(k==="ipc-devices"){if((b.checks||[]).length>(a.checks||[]).length)return "daily check saved";if(!a.removed&&b.removed)return `removed ${fmt(b.removed)}`;if((b.adh||[]).length>(a.adh||[]).length)return "adherence monitoring saved";}
  if(k==="ipc-events"&&a.status!==b.status)return `review: ${b.status}`;
  if(k==="ipc-actions"&&a.status!==b.status)return `status: ${b.status}`;

function trackDiff(k,v){
  const old=SNAP[k]||{},now=snapOf(v),ts=Date.now(),by=S.user.name,what=TRACK[k],add=[];
  for(const [id,j] of Object.entries(now)){if(!(id in old))add.push({ts,by,what,act:"Added",label:logLabel(k,JSON.parse(j))});
    else if(old[id]!==j)add.push({ts,by,what,act:"Changed",label:logLabel(k,JSON.parse(j)),note:changeNote(k,JSON.parse(old[id]),JSON.parse(j))});}
  for(const [id,j] of Object.entries(old))if(!(id in now))add.push({ts,by,what,act:"Deleted",label:logLabel(k,JSON.parse(j))});
  SNAP[k]=now;if(!add.length)return;
  S.log=[...(S.log||[]),...add].slice(-6000);

}

async function hashPw(pw,salt){
  const s=salt+"::"+pw;
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}}catch(e){}
  let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<s.length;i++){h1=Math.imul(h1^s.charCodeAt(i),16777619);h2=Math.imul(h2^s.charCodeAt(i),2246822507);}
  return "f"+(h1>>>0).toString(16)+(h2>>>0).toString(16);
}

function lastMonths(n){const out=[],d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({key:x.toISOString().slice(0,7),label:x.toLocaleString("en",{month:"short"})+" '"+String(x.getFullYear()).slice(2)});}return out;}
function trendSVG(type,list){
  const months=lastMonths(6),tg=target(type),hex=MODULES[type].hex;
  const pts=months.map(m=>{const l=list.filter(a=>a.type===type&&a.date.startsWith(m.key));return{...m,n:l.length,v:pctN(l.filter(a=>a.compliant).length,l.length)};});
  const W=340,H=180,pl=36,pr=24,pt=16,pb=40,iw=W-pl-pr,ih=H-pt-pb;
  const x=i=>pl+i*iw/(months.length-1),y=v=>pt+(100-v)/100*ih;
  let path="",pen=false;pts.forEach((p,i)=>{if(p.v===null){pen=false;return;}path+=(pen?"L":"M")+x(i)+" "+y(p.v)+" ";pen=true;});
  const any=pts.some(p=>p.n);
  return `<div class="chart"><h3 style="color:${hex}">${MODULES[type].name}</h3>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${MODULES[type].name} monthly compliance, target ${tg} percent">
    ${[0,50,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#E3EAED"/><text x="${pl-6}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="#566B77">${v}%</text>`).join("")}
    <line x1="${pl}" x2="${W-pr}" y1="${y(tg)}" y2="${y(tg)}" stroke="#1E7B4F" stroke-dasharray="5 4" stroke-width="1.5"/>
    <text x="${W-pr}" y="${y(tg)-5}" font-size="10" text-anchor="end" fill="#1E7B4F">Target ${tg}%</text>
    ${path?`<path d="${path}" fill="none" stroke="${hex}" stroke-width="2.5"/>`:""}
    ${pts.map((p,i)=>`${p.v!==null?`<circle cx="${x(i)}" cy="${y(p.v)}" r="4" fill="${p.v>=tg?"#1E7B4F":"#B42318"}"/><text x="${x(i)}" y="${y(p.v)-8}" font-size="10" text-anchor="middle" font-weight="700" fill="#10293B">${p.v}</text>`:""}
      <text x="${x(i)}" y="${H-22}" font-size="10" text-anchor="middle" fill="#10293B">${p.label}</text>
      <text x="${x(i)}" y="${H-9}" font-size="9" text-anchor="middle" fill="#566B77">n=${p.n}</text>`).join("")}
  </svg>${any?"":`<p class="hint">No entries in the last 6 months.</p>`}</div>`;
}

/* draft a corrective action when a department stays below target two complete months in a row */
async function autoActions(){
  if(!isTeam())return;
  const m1=prevMonth(monthKey(today())),m2=prevMonth(m1);let made=0;
  for(const k of Object.keys(MODULES)){
    const depts=[...new Set(S.audits.filter(a=>a.type===k&&[m1,m2].includes(monthKey(a.date))).map(deptName))];
    for(const d of depts){
      const r=m=>{const l=S.audits.filter(a=>a.type===k&&deptName(a)===d&&monthKey(a.date)===m);return{n:l.length,p:pctN(l.filter(a=>a.compliant).length,l.length)};};
      const a1=r(m1),a2=r(m2),tg=target(k),key=`${k}|${d}|${m1}`;
      if(a1.n>=5&&a2.n>=5&&a1.p<tg&&a2.p<tg&&!S.actions.some(x=>x.autoKey===key)){
        S.actions.push({id:uid(),created:today(),module:k,dept:d,auto:true,autoKey:key,
          issue:`${MODULES[k].name} below the ${tg}% target two months running: ${a2.p}% in ${monthName(m2)} (n=${a2.n}) and ${a1.p}% in ${monthName(m1)} (n=${a1.n}).`,
          action:"",owner:"",due:addDays(today(),14),status:"Open",by:"Platform"});made++;}
    }
  }
  if(made){await sset("ipc-actions",S.actions);toast(`${made} corrective action ${made===1?"draft":"drafts"} created`);}
}

function segs(p){const h=p.bedHistory||[],out=[];let st=p.admitDate;
  h.forEach(x=>{out.push({unit:x.unit,s:st,e:x.until});st=x.until;});

  if(rule)for(let j=i;j>0&&dayDiff(g[j].s,date)<=1;j--){if(g[j-1].unit!==g[j].unit)return g[j-1].unit;}
  return g[i].unit;}

/* ---------- NHSN-style device association screen ---------- */
function assess(ev){
  const p=ptOf(ev.patientId),E=ev.date,type=SPECIMENS.find(s=>s[0]===ev.specimen)?.[1];
  const hd=p?hospDay(p,E):null;
  const out={hd,type,deviceId:null,kind:"info",label:"",why:""};
  if(type==="ssi"){
    const pr=S.surg.filter(x=>x.patientId===ev.patientId&&x.date<=E).sort((a,b)=>b.date.localeCompare(a.date));
    const hit=pr.find(x=>dayDiff(x.date,E)+1<=(x.implant==="Yes"?90:30));
    if(hit){out.kind="flag";out.procId=hit.id;out.label="Possible SSI";
      out.why=`${hit.procedure} on ${fmt(hit.date)}; the date of event is post-operative day ${dayDiff(hit.date,E)+1}, inside the ${hit.implant==="Yes"?"90":"30"}-day surveillance window. Apply the SSI criteria.`;return out;}
    out.label=pr.length?"Outside the SSI window":"No surgical procedure recorded";
    out.why=pr.length?`The last recorded procedure was on ${fmt(pr[0].date)}, outside the 30-day window (90 days with an implant).`:"Record the operation on the patient's page to screen this culture for SSI.";return out;}
  if(hd!==null&&hd<3){out.kind="poa";out.label="Present on admission window";
    out.why=`Date of event is hospital day ${hd}. Events before day 3 of admission fall in the present-on-admission window and are not counted as HAI.`;return out;}
  if(!type){out.label="Not linked to a monitored device";out.why="Specimen type is not linked to a urinary catheter, central line or ventilator. Assess for other HAI types.";return out;}
  const types=type==="mv"?["mv","pv"]:[type];
  const cands=devsOf(ev.patientId).filter(d=>types.includes(d.type)&&d.insertDate<=E);
  for(const d of cands){
    const daysOnE=devDay(d,d.removed&&d.removed<E?d.removed:E);
    const inPlace=!d.removed||d.removed>=addDays(E,-1);
    if(inPlace&&daysOnE>2){
      const T=d.type;out.type=T;
      out.kind="flag";out.deviceId=d.id;out.label=`Possible ${DEV[T].hai}`;
      out.why=d.removed&&d.removed<E
        ?`${DEV[T].name} was in place ${daysOnE} days and removed on ${fmt(d.removed)}, the day before the date of event, so it still counts. Apply the full ${DEV[T].hai} criteria.`
        :`${DEV[T].name} in place for more than 2 days on the date of event (device day ${devDay(d,E)}). Apply the full ${DEV[T].hai} criteria.`;
      return out;
    }
  }
  if(cands.length){out.label=`Not device-associated by timing`;
    out.why=`A ${DEV[type].name.toLowerCase()} was present, but it was either in place 2 days or fewer on the date of event, or removed more than 1 day before it.`;return out;}
  out.label=`No ${DEV[type].name.toLowerCase()} recorded`;out.why=`No ${DEV[type].name.toLowerCase()} on record before the date of event. Assess for non-device HAI if criteria are met.`;
  return out;
}

  const uAt=(pid,date,rule)=>{const p=ptOf(pid);return p?unitAt(p,date,rule):null;};
  const ptDays=S.patients.reduce((t,p)=>t+segs(p).filter(g=>inU(g.unit)).reduce((x,g)=>x+overlap(g.s,g.e,pS,pE),0),0);
  const devDays=d=>{const p=ptOf(d.patientId);if(!p)return 0;const end=d.removed||pE;
    return segs(p).filter(g=>inU(g.unit)).reduce((x,g)=>x+overlap(d.insertDate>g.s?d.insertDate:g.s,end<g.e?end:g.e,pS,pE),0);};
  const rows=Object.entries(DEV).map(([k,m])=>{
    const ds=S.devices.filter(d=>d.type===k);
    const dd=ds.reduce((x,d)=>x+devDays(d),0);
    const ch=ds.flatMap(d=>d.checks.filter(c=>inP(c.date)&&inU(uAt(d.patientId,c.date))));
    const ins=ds.filter(d=>d.insObserved==="Yes"&&inP(d.insertDate)&&inU(uAt(d.patientId,d.insertDate)));
    const hai=S.events.filter(e=>e.status==="Confirmed HAI"&&inP(e.date)&&inU(uAt(e.patientId,e.date,true))).filter(e=>{const a=assess(e);return a.type===k&&a.kind==="flag";}).length;
    const fails=m.maint.map(i=>{const a=ch.filter(c=>c.items[i.k]&&c.items[i.k]!=="na"),nos=a.filter(c=>c.items[i.k]==="n");return{t:i.t,no:nos.length,n:a.length,why:topReason(nos,i.k)};})
      .filter(x=>x.no).sort((x,y)=>y.no/y.n-x.no/x.n);
    return{k,m,dd,ch,chOk:ch.filter(checkOk).length,ins,insOkN:ins.filter(d=>insOk(d)).length,hai,fails};
  });
  const adh=S.devices.filter(d=>d.type==="uc").flatMap(d=>(d.adh||[]).filter(x=>inP(x.date)&&inU(uAt(d.patientId,x.date))));
  const tasks=ADH_ITEMS.map(i=>{const o=adh.filter(x=>x.items[i.k]==="y"||x.items[i.k]==="n");return{t:i.t,y:o.filter(x=>x.items[i.k]==="y").length,o:o.length};});
  const Y=tasks.reduce((t,x)=>t+x.y,0),O=tasks.reduce((t,x)=>t+x.o,0);
  const ours={adh_uc:pctN(Y,O)};
  rows.forEach(r=>{ours["b_"+r.k]=pctN(r.chOk,r.ch.length);ours["i_"+r.k]=pctN(r.insOkN,r.ins.length);ours["r_"+r.k]=r.dd?r.hai/r.dd*1000:null;});
  const ops=S.surg.filter(x=>inP(x.date)&&inU(uAt(x.patientId,x.date))),opIds=new Set(ops.map(x=>x.id));
  const ssi=S.events.filter(e=>e.status==="Confirmed HAI").filter(e=>{const a=assess(e);return a.type==="ssi"&&a.kind==="flag"&&opIds.has(a.procId);}).length;
  ours.b_ssi=pctN(ops.filter(surgOk).length,ops.length);ours.r_ssi=ops.length?ssi/ops.length*100:null;
  const outc={};
  S.patients.filter(p=>p.status==="discharged"&&inP(p.discharged)&&inU(p.unit)).forEach(p=>{const o=p.outcome||"Discharged (outcome not recorded)";outc[o]=(outc[o]||0)+1;});
  S.patients.forEach(p=>(p.transfers||[]).filter(t=>inP(t.date)&&inU(t.from)&&BUNDLE_UNITS.includes(t.to)&&t.to!==t.from).forEach(()=>{const o="Moved to another unit on the round";outc[o]=(outc[o]||0)+1;}));
  const periods=[["30","Last 30 days"],["90","Last 3 months"],["180","Last 6 months"],["365","Last 12 months"],["all","All time"]];
  return `<div class="wrap wide">${bcrumb("Device dashboard")}
    <h1>Device dashboard</h1>
    <div class="row" style="margin:12px 0">
      <div><label class="f" for="bu">Unit</label><select id="bu" data-bd="unit"><option value="all">All units</option>${BUNDLE_UNITS.map(u=>`<option ${b.unit===u?"selected":""}>${u}</option>`).join("")}</select></div>
      <div><label class="f" for="bp">Period</label><select id="bp" data-bd="period">${periods.map(([v,l])=>`<option value="${v}" ${b.period===v?"selected":""}>${l}</option>`).join("")}</select></div></div>
    <p class="lead">Patient days in this view: <b style="color:var(--ink)">${ptDays}</b>. Days are counted in the unit where the patient actually was, so transfers split correctly. Device days run from insertion (day 1) to the day before removal.
      ${Object.keys(outc).length?`<br>Left the unit: ${Object.entries(outc).map(([o,n])=>`${esc(o.toLowerCase())} ${n}`).join(", ")}.`:""}</p>
    <div class="scroll"><table><thead><tr><th>Device</th><th>Device days</th><th>Utilization</th><th>Daily bundle</th><th>Insertion bundle</th><th>Confirmed HAI</th><th>Rate per 1,000<br>device days</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><th scope="row" style="border-left:5px solid ${r.m.hex}">${r.m.name}</th><td class="c">${r.dd}</td><td class="c">${ptDays?(r.dd/ptDays).toFixed(2):"–"}</td>
        <td class="c">${pct(r.chOk,r.ch.length)}<small>${r.chOk} of ${r.ch.length} checks</small></td>
        <td class="c">${r.m.ins.length?`${pct(r.insOkN,r.ins.length)}<small>${r.insOkN} of ${r.ins.length} observed</small>`:"–"}</td>
        <td class="c">${r.hai}<small>${r.m.hai}</small></td><td class="c"><b>${r.dd?(r.hai/r.dd*1000).toFixed(2):"–"}</b></td></tr>`).join("")}
    </tbody></table></div>
    <p class="hint">Bundle compliance is all-or-none: a check is compliant only if no element is marked No. An infection dated on a transfer day or the day after is counted in the transferring unit.</p>
    <h2>Surgical procedures</h2>
    <div class="scroll"><table><thead><tr><th>Operations</th><th>Surgical bundle</th><th>Confirmed SSI</th><th>SSI rate per 100 operations</th></tr></thead><tbody>
      <tr><td class="c">${ops.length}</td><td class="c">${pct(ops.filter(surgOk).length,ops.length)}<small>${ops.filter(surgOk).length} of ${ops.length}</small></td><td class="c">${ssi}</td><td class="c"><b>${ops.length?(ssi/ops.length*100).toFixed(1):"–"}</b></td></tr></tbody></table></div>
    <p class="hint">Operations are counted in the period and unit of the operation; an SSI counts against the operation it follows.</p>
    <h2>Against targets and benchmarks</h2>
    ${benchTable(["b_uc","b_cl","b_mv","b_pv","i_uc","i_cl","adh_uc","b_ssi","r_uc","r_cl","r_mv","r_pv","r_ssi"],ours)}
    <h2>Most failed daily bundle elements</h2>
    <div class="fails">${rows.map(r=>`<div class="card"><h3 style="color:${r.m.hex}">${r.m.name}</h3>${r.fails.length?`<ol>${r.fails.slice(0,3).map(x=>`<li>${esc(x.t)}: failed ${x.no} of ${x.n} (${pct(x.no,x.n)})${x.why}</li>`).join("")}</ol>`:`<p class="hint">No failed elements in this view.</p>`}</div>`).join("")}</div>
    <h2>Urinary catheter adherence monitoring</h2>
    ${adh.length?`<p class="lead">${adh.length} ${adh.length===1?"assessment":"assessments"}. Adherence rate (total Yes divided by total observed): <b style="color:var(--ink)">${pct(Y,O)}</b>, ${Y} of ${O}.</p>
      <div class="scroll"><table><thead><tr><th>Practice</th><th>Yes</th><th>Observed</th><th>Adherence by task</th></tr></thead><tbody>
      ${tasks.map((x,n)=>`<tr><td>${n+1}. ${esc(x.t)}</td><td class="c">${x.y}</td><td class="c">${x.o}</td><td class="c ${x.o?(x.y===x.o?"good":"bad"):"none"}">${pct(x.y,x.o)}</td></tr>`).join("")}</tbody></table></div>`
      :`<div class="card">No adherence monitoring in this view.</div>`}
    <div class="row" style="margin-top:18px"><div style="flex:0 0 auto"><button class="btn ghost" data-a="bcsv">Export daily checks to CSV</button></div>
      <div style="flex:0 0 auto"><button class="btn ghost" data-a="adhcsv">Export adherence monitoring to CSV</button></div>
      <div style="flex:0 0 auto"><button class="btn ghost" data-a="nav" data-v="bench">Edit targets and benchmarks</button></div></div>
  </div>`;
}

async function persistB(){await sset("ipc-patients",S.patients);await sset("ipc-devices",S.devices);await sset("ipc-events",S.events);}
async function savePt(){
  const f=S.form;
  f.mrn=f.mrn.trim();f.idNo=f.idNo.trim();
  if(!f.bed.trim())return fail("Select the bed.");
  if(!/^6\d{6}$/.test(f.mrn))return fail("The MRN must be 7 digits starting with 6.");
  if(!/^\d{10}$/.test(f.idNo))return fail("The patient ID number must be 10 digits.");
  if(!f.name.trim())return fail("Enter the patient name.");
  if(!f.dob)return fail("Enter the date of birth.");
  if(!f.admitDate)return fail("Enter the admission date.");
  if(f.dob>f.admitDate)return fail("The date of birth is after the admission date.");
  const clash=S.patients.find(p=>p.status==="active"&&p.id!==f.id&&p.unit===f.unit&&String(p.bed).trim()===f.bed.trim());
  if(clash)return fail(`Bed ${f.bed} in ${f.unit} is already taken by ${clash.name}. Discharge or move that patient first.`);
  if(S.patients.some(p=>p.status==="active"&&p.id!==f.id&&p.mrn.trim()===f.mrn.trim()))return fail("An active patient with this MRN already exists.");
  if(f.id){const p=ptOf(f.id);if(p.bed!==f.bed.trim()||p.unit!==f.unit)(p.bedHistory=p.bedHistory||[]).push({unit:p.unit,bed:p.bed,until:today()});
    Object.assign(p,{unit:f.unit,bed:f.bed.trim(),mrn:f.mrn.trim(),idNo:f.idNo.trim(),name:f.name.trim(),dob:f.dob,admitDate:f.admitDate,sex:f.sex,diagnosis:f.diagnosis});
    S.round.unit=p.unit;await persistB();go("patient",{pid:p.id});toast("Patient updated");}
  else{const p={id:uid(),unit:f.unit,bed:f.bed.trim(),mrn:f.mrn.trim(),idNo:f.idNo.trim(),name:f.name.trim(),dob:f.dob,admitDate:f.admitDate,sex:f.sex,diagnosis:f.diagnosis,status:"active",by:S.user.name};
    S.patients.push(p);S.round.unit=p.unit;await persistB();go("patient",{pid:p.id});toast("Patient added");}
}
async function dischargePt(){
  const p=ptOf(S.pid),f=S.form,d=f.date,last=(p.bedHistory||[]).at(-1)?.until||p.admitDate;
  if(!f.outcome)return fail("Select how the patient left the unit.");
  if(!d||d<p.admitDate||d>today())return fail("Choose a date between admission and today.");
  const transfer=f.outcome==="Transferred to another ward";
  if(transfer){
    if(!f.toUnit)return fail("Select the receiving ward.");
    if(f.toUnit==="Other"&&!f.toUnitOther.trim())return fail("Name the receiving ward.");
    if(BUNDLE_UNITS.includes(f.toUnit)){
      if(!f.bed.trim())return fail("Enter the bed number in the receiving unit.");
      if(d<last)return fail("The transfer date is earlier than the patient's last bed move.");
      const clash=S.patients.find(x=>x.status==="active"&&x.id!==p.id&&x.unit===f.toUnit&&String(x.bed).trim()===f.bed.trim());
      if(clash)return fail(`Bed ${f.bed} in ${f.toUnit} is already taken by ${clash.name}.`);
      (p.bedHistory=p.bedHistory||[]).push({unit:p.unit,bed:p.bed,until:d});
      (p.transfers=p.transfers||[]).push({date:d,from:p.unit,to:f.toUnit,note:f.note});
      p.unit=f.toUnit;p.bed=f.bed.trim();S.round.unit=p.unit;
      await persistB();go("patient",{pid:p.id});toast(`Moved to ${p.unit}, bed ${p.bed}`);return;
    }
  }
  const to=transfer?(f.toUnit==="Other"?f.toUnitOther.trim():f.toUnit):"";
  if(transfer)(p.transfers=p.transfers||[]).push({date:d,from:p.unit,to,note:f.note});
  Object.assign(p,{status:"discharged",discharged:d,outcome:f.outcome,toUnit:to,dischargeNote:f.note});
  activeDevs(p.id).forEach(x=>{x.removed=d<x.insertDate?x.insertDate:d;if(transfer)x.endReason="Left the round with the patient";});
  await persistB();go("round");toast(f.outcome==="Death"?"Death recorded":"Patient discharged");
}

async function saveDev(){
  const f=S.form,m=DEV[f.type];
  if(!f.insertDate)return fail("Enter the insertion date.");
  if(f.insertDate>today())return fail("The insertion date cannot be in the future.");
  if(f.type==="cl"&&(!f.clType||!f.clSite||!f.clDuration))return fail("Select catheter type, site and duration.");
  if((f.type==="mv"||f.type==="pv")&&!f.route)return fail("Select the airway.");
  if(m.ins.length&&!f.insObserved)return fail("Say whether the insertion was observed.");
  if(f.insObserved==="Yes"){const i=m.ins.findIndex(x=>!f.items[x.k]);if(i>-1)return fail(`Answer item ${i+1} of the insertion bundle.`);}
  const d={id:uid(),patientId:S.pid,type:f.type,insertDate:f.insertDate,place:f.place,clType:f.clType,clSite:f.clSite,clDuration:f.clDuration,route:f.route,size:f.size,birthWt:f.birthWt||"",
    insObserved:m.ins.length?f.insObserved:"N/A",insItems:f.insObserved==="Yes"?{...f.items}:{},removed:null,checks:[],by:S.user.name};
  S.devices.push(d);await persistB();go("patient",{pid:S.pid});toast(`${m.name} added`);
}
async function saveCheck(){
  const f=S.form,d=devOf(S.did),m=DEV[d.type];
  if(!f.date||f.date<d.insertDate||f.date>today())return fail("Choose a date between insertion and today.");
  const i=m.maint.findIndex(x=>!f.items[x.k]);if(i>-1)return fail(`Answer element ${i+1} of the bundle.`);
  const sm=subMiss(m.maint,f);if(sm>-1)return fail(`Element ${sm+1}: select what was wrong.`);
  d.checks=d.checks.filter(c=>c.date!==f.date);d.checks.push({date:f.date,items:{...f.items},subs:JSON.parse(JSON.stringify(f.subs||{})),note:f.note,by:S.user.name});
  await persistB();const ok=checkOk(d.checks.at(-1));go("patient",{pid:d.patientId});toast(ok?"Check saved: compliant":"Check saved: not compliant",!ok);
}
async function saveCult(){
  const f=S.form;
  if(!f.specimen)return fail("Select the specimen.");
  if(!f.date)return fail("Enter the collection date.");
  if(!f.organism.trim())return fail("Enter the organism.");
  const e={id:uid(),patientId:S.pid,specimen:f.specimen,date:f.date,organism:f.organism.trim(),count:f.count,note:f.note,status:"Under review",reviewNote:"",by:S.user.name};
  S.events.push(e);await persistB();const a=assess(e);go("patient",{pid:S.pid});toast(a.label,a.kind==="flag");
}
function bcsv(){
  const head=["Unit","Bed","MRN","Patient","Device","Inserted","Removed","Check date","Device day","Elements","Result","By","Note"];
  const rows=[];S.devices.forEach(d=>{const p=ptOf(d.patientId),m=DEV[d.type];d.checks.forEach(c=>rows.push([p.unit,p.bed,p.mrn,p.name,m.name,d.insertDate,d.removed||"",c.date,devDay(d,c.date),
    m.maint.map(i=>`${withWhy(i,c)}: ${({y:"Yes",n:"No",na:"N/A"})[c.items[i.k]]}`).join(" | "),checkOk(c)?"Compliant":"Not compliant",c.by,c.note||""]));});
  const text="\uFEFF"+[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const url=URL.createObjectURL(new Blob([text],{type:"text/csv"}));const l=document.createElement("a");l.href=url;l.download=`ipc-bundle-checks-${today()}.csv`;l.click();URL.revokeObjectURL(url);
}
async function handleBundle(a,b){
  if(!canMod("bundles"))return false;
  switch(a){
    case "unit":S.round.unit=b.dataset.v;render();return true;
    case "showdis":S.round.dis=!S.round.dis;render();return true;
    case "newpt":S.scan={};go("ptform",{form:{unit:S.round.unit,bed:"",mrn:"",idNo:"",name:"",dob:"",admitDate:today(),sex:"",diagnosis:""}});return true;
    case "editpt":{S.scan={};const p=ptOf(S.pid);go("ptform",{form:{...p,idNo:p.idNo||"",diagnosis:p.diagnosis||""}});return true;}
    case "savept":savePt();return true;
    case "openpt":go("patient",{pid:b.dataset.id});return true;
    case "dispt":go("dischg",{form:{outcome:"",date:today(),toUnit:"",toUnitOther:"",bed:"",note:""}});return true;
    case "savedis":dischargePt();return true;
    case "adddev":go("devnew",{form:{type:b.dataset.t,insertDate:today(),place:"This unit",clType:"",clSite:"",clDuration:"",route:"",size:"",insObserved:"",items:{}}});return true;
    case "savedev":saveDev();return true;
    case "opendev":go("device",{did:b.dataset.id});return true;
    case "newcheck":{const d=devOf(b.dataset.id),date=b.dataset.date||today(),ex=d.checks.find(c=>c.date===date);
      go("check",{did:d.id,pid:d.patientId,form:{date,items:ex?{...ex.items}:{},subs:ex?.subs?JSON.parse(JSON.stringify(ex.subs)):{},note:ex?.note||""}});return true;}
    case "savecheck":saveCheck();return true;
    case "newadh":{const d=devOf(b.dataset.id);go("adh",{did:d.id,pid:d.patientId,form:{date:today(),position:"",items:{},subs:{},note:""}});return true;}
    case "saveadh":saveAdh();return true;
    case "adhcsv":if(isTeam())adhcsv();return true;
    case "removedev":{const d=devOf(S.did),r=$("#rmd").value;if(!r||r<d.insertDate||r>today()){toast("Choose a removal date between insertion and today",true);return true;}
      if(!confirm(`Remove this ${DEV[d.type].name.toLowerCase()} on ${fmt(r)}?`))return true;d.removed=r;await persistB();go("patient",{pid:d.patientId});toast("Device removed");return true;}
    case "newcult":go("culture",{form:{specimen:"",date:today(),organism:"",count:"",note:""}});return true;
    case "savecult":saveCult();return true;
    case "newsurg":go("surg",{form:{procedure:"",date:today(),implant:"",items:{},subs:{},note:""}});return true;
    case "savesurg":saveSurg();return true;
  }
  if(!isTeam())return false;
  switch(a){
    case "opencase":{const e=S.events.find(x=>x.id===b.dataset.id);go("case",{eid:e.id,form:{status:e.status,reviewNote:e.reviewNote||"",criteria:JSON.parse(JSON.stringify(e.criteria||{}))}});return true;}
    case "savecase":{const e=S.events.find(x=>x.id===S.eid);e.status=S.form.status||"Under review";e.reviewNote=S.form.reviewNote;e.criteria=S.form.criteria||{};e.reviewedBy=S.user.name;await persistB();go("cases");toast("Review saved");return true;}
    case "critpick":S.form.criteria=S.form.criteria||{};S.form.criteria.level=b.dataset.v;render();return true;
    case "ackcl":{S.settings.ack={...(S.settings.ack||{}),[b.dataset.v]:today()};await sset("ipc-settings",S.settings);render();toast("Marked as reviewed");return true;}
    case "delcase":if(confirm("Delete this culture record?")){S.events=S.events.filter(x=>x.id!==S.eid);await persistB();go("cases");}return true;
    case "bcsv":bcsv();return true;
  }
  return false;
}

/* For the hosted copy (GitHub Pages) put the address of your AI proxy here, and the same token you set on the proxy.
   Inside Claude neither is needed. See ai-proxy-worker.js. */
const AI_ENDPOINT="";
const AI_TOKEN="";
const inClaude=()=>!!window.storage;
const aiReady=()=>inClaude()||!!AI_ENDPOINT;
const AI={open:false,busy:false,listening:false,lang:"ar-SA",msgs:[],hist:[],rec:null,base:""};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

async function aiCall(system,messages){
  const url=inClaude()?"https://api.anthropic.com/v1/messages":AI_ENDPOINT;
  const headers={"Content-Type":"application/json"};if(!inClaude()&&AI_TOKEN)headers["X-IPC-Token"]=AI_TOKEN;
  const r=await fetch(url,{method:"POST",headers,body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system,messages})});
  if(!r.ok)throw new Error("HTTP "+r.status);
  const d=await r.json(),t=(d.content||[]).map(x=>x.type==="text"?x.text:"").join("\n").replace(/```json|```/g,"");
  return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));

/* ---------- applying a reply safely ---------- */
function matchOpt(v,opts){if(v===undefined||v===null)return undefined;const s=String(v).trim().toLowerCase();return opts.find(o=>String(o).toLowerCase()===s);}
function fixRoom(dept,locType,v){
  const L=LOC[dept];if(!L||!v)return null;const s=String(v).trim();
  if(locType!=="Area"&&Array.isArray(L.rooms)){for(const c of [s,`Bed ${s}`,`Room ${s}`,s.replace(/^(bed|room)\s*/i,"")]){const m=matchOpt(c,L.rooms);if(m)return{locType:"Patient room",room:m};}}
  if(locType!=="Area"&&L.rooms==="text"&&/\d/.test(s))return{locType:"Patient room",room:s.replace(/^(bed|room)\s*/i,"")};
  const a=matchOpt(s,L.areas||[]);if(a)return{locType:"Area",room:a};
  if(locType==="Area"&&(L.areas||[]).length)return{locType:"Area",room:"Other area",areaOther:s};
  return null;
}
function fixBed(unit,v){const l=BEDS[unit]||[];if(!v)return null;const s=String(v).trim().replace(/^bed\s*/i,"");return matchOpt(s,l)||null;}
function aiApply(spec,set){
  const f=S.form,done=[],miss=[];if(!set||typeof set!=="object")return{done,miss};
  const lab=k=>spec.fields.find(x=>x.k===k)?.l.split(/[,(]/)[0]||k;
  const order=["dept","unit","outcome","toUnit","locType"];
  const keys=[...order.filter(k=>k in set),...Object.keys(set).filter(k=>!order.includes(k))];
  for(const k of keys){
    const fd=spec.fields.find(x=>x.k===k),v=set[k];if(!fd)continue;
    if(k==="room"){const L=fixRoom(f.dept,set.locType||f.locType,v);if(L){Object.assign(f,{areaOther:"",...L});if(S.view==="env")f.st={};done.push(`Location: ${L.areaOther||L.room}`);}else miss.push(`room "${v}"`);continue;}
    if(k==="bed"){const u=S.view==="dischg"?f.toUnit:f.unit,b=fixBed(u,v);if(b){f.bed=b;done.push(`Bed: ${b}`);}else miss.push(`bed "${v}"`);continue;}
    if(fd.t==="enum"){const m=matchOpt(v,fd.o);if(m===undefined){miss.push(`${lab(k)} "${v}"`);continue;}
      if(k==="dept"&&f.dept!==m)Object.assign(f,{room:"",areaOther:"",locType:"",specialty:"",specialtyOther:""});
      if((k==="unit"||k==="toUnit")&&f[k]!==m)f.bed="";
      f[k]=m;if(k==="action"&&m!=="missed")f.gloves="";done.push(`${lab(k)}: ${k==="action"?HH_ACTIONS.find(a=>a.k===m).l:m}`);}
    else if(fd.t==="multi"){const l=(Array.isArray(v)?v:[v]).map(x=>matchOpt(x,fd.o)).filter(x=>x!==undefined);if(l.length){f[k]=[...new Set(l)].sort();done.push(`${lab(k)}: ${f[k].join(", ")}`);}}
    else if(fd.t==="date"){if(/^\d{4}-\d{2}-\d{2}$/.test(v)&&v<=today()){f[k]=v;done.push(`${lab(k)}: ${fmt(v)}`);}else miss.push(`${lab(k)} "${v}"`);}
    else if(typeof v==="string"&&v.trim()){f[k]=k==="note"&&f.note&&!f.note.includes(v)?`${f.note} ${v}`.trim():v.trim();done.push(`${lab(k)}: ${f[k]}`);}
  }
  if(spec.items&&set.items){f.items=f.items||{};f.subs=f.subs||{};
    spec.items.forEach((it,n)=>{const v=set.items[it.k];if(!["y","n","na"].includes(v))return;f.items[it.k]=v;
      if(v==="n"&&it.subs){const r=(set.subs?.[it.k]||[]).map(x=>matchOpt(x,it.subs)).filter(Boolean);if(r.length)f.subs[it.k]=[...new Set(r)];}
      else delete f.subs[it.k];
      done.push(`${n+1}. ${it.t}: ${({y:"Yes",n:"No",na:"N/A"})[v]}${f.subs[it.k]?.length?` (${f.subs[it.k].join(", ")})`:""}`);});}
  if(spec.env){
    const prof=envProfile(f),envSet=set.env||{};
    if(set.responsibility&&ENV_RESP[set.responsibility]&&!envSet[set.responsibility])envSet[set.responsibility]={};
    for(const [r,marks] of Object.entries(envSet)){if(!ENV_RESP[r])continue;
      if(!f.seen.includes(r))f.seen.push(r);f.resp=r;const list=envList(prof,r);
      for(const [k,v] of Object.entries(marks||{})){const it=list.find(i=>i.k===k);if(!it){const g=envAll().find(i=>i.k===k);miss.push(`${g?.t||k} is not on the ${r.toLowerCase()} checklist here`);continue;}
        if(v==="not_clean")f.st[it.k]="n";else if(v==="na")f.st[it.k]="na";else delete f.st[it.k];
        done.push(`${r}: ${it.t}: ${v==="not_clean"?"Not clean":v==="na"?"Not available":"Clean"}`);}
      if(!Object.keys(marks||{}).length)done.push(`Responsibility: ${r}`);}
  }
  return{done,miss};
}

function aiNavigate(j){
  if(j.type==="open"){const t=j.target;if(!TARGETS().includes(t))return `You do not have access to "${t}".`;
    if(MODULES[t]){S.module=t;S.session={n:0,ok:0};go(t,{form:freshForm(t)});}else go(t);return null;}
  if(j.type==="patient"){
    if(!canMod("bundles"))return "You do not have access to the device round.";
    const unit=matchOpt(j.unit,BUNDLE_UNITS),p=S.patients.find(x=>x.status==="active"&&x.unit===unit&&String(x.bed).toLowerCase()===String(j.bed||"").replace(/^bed\s*/i,"").toLowerCase());
    if(!p)return `No active patient found in ${j.unit||"that unit"} bed ${j.bed||"?"}.`;
    if(!deptOk(p.unit))return "You do not have access to that unit.";
    S.pid=p.id;const task=j.task||"open",fake=ds=>({dataset:ds});
    if(task==="open"){go("patient",{pid:p.id});return null;}
    if(task==="culture"){handleBundle("newcult",fake({}));return null;}
    if(task==="discharge"){handleBundle("dispt",fake({}));return null;}
    if(task==="surgery"){handleBundle("newsurg",fake({}));return null;}
    const d=activeDevs(p.id).find(x=>!j.device||x.type===j.device);
    if(!d)return `No active ${j.device?DEV[j.device].name.toLowerCase():"device"} on bed ${p.bed}.`;
    if(task==="check"){handleBundle("newcheck",fake({id:d.id}));return null;}
    if(task==="adh"){if(d.type!=="uc")return "Adherence monitoring is for urinary catheters.";handleBundle("newadh",fake({id:d.id}));return null;}
    go("patient",{pid:p.id});return null;
  }
  return null;
}
async function aiSend(text){
  text=(text||"").trim();if(!text||AI.busy)return;
  AI.msgs.push({me:true,text});AI.busy=true;renderAI();
  if(!aiReady()){AI.busy=false;AI.msgs.push({text:isTeam()?"The assistant is not connected yet. Add the AI proxy address to AI_ENDPOINT at the top of the assistant section in index.html, as described in the setup notes.":"The assistant is not connected yet. Ask the Infection Control Team."});renderAI();return;}
  const spec=aiForm();
  try{
    AI.hist.push({role:"user",content:text});AI.hist=AI.hist.slice(-8);
    const j=await aiCall(aiSystem(spec),AI.hist);
    AI.hist.push({role:"assistant",content:JSON.stringify(j)});
    let note=j.text||"",res=null;
    if(j.type==="fill"&&spec){res=aiApply(spec,j.set);render();}
    else if(j.type==="open"||j.type==="patient"){const err=aiNavigate(j);if(err)note=err;else if(j.set&&Object.keys(j.set).length){const s2=aiForm();if(s2){res=aiApply(s2,j.set);render();}}}
    AI.msgs.push({text:note,done:res?.done,miss:res?.miss,review:!!res?.done?.length});
    if(res?.done?.length&&window.innerWidth<700){AI.open=false;toast(`Filled ${res.done.length} ${res.done.length===1?"field":"fields"}. Review and save.`);}
  }catch(e){AI.msgs.push({text:"The assistant could not be reached. Check the connection and try again.",bad:true});}
  AI.busy=false;renderAI();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-ai]");if(!b)return;e.stopPropagation();
  const a=b.dataset.ai;
  if(a==="open"){AI.open=true;renderAI();$("#ai-in")?.focus();}
  else if(a==="close"){AI.rec?.stop();AI.open=false;renderAI();}
  else if(a==="lang"){AI.lang=AI.lang==="ar-SA"?"en-US":"ar-SA";renderAI();}
  else if(a==="mic")micToggle();
  else if(a==="hint"){aiSend(b.textContent);}
  else if(a==="send"){const ta=$("#ai-in"),v=ta.value;ta.value="";aiSend(v);}
},true);

/* dates always shown in English digits as DD/MM/YYYY, whatever the phone's language */
const toDMY=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?`${v.slice(8)}/${v.slice(5,7)}/${v.slice(0,4)}`:"";
const ARD="٠١٢٣٤٥٦٧٨٩";
function fromDMY(t){t=(t||"").replace(/[٠-٩]/g,d=>ARD.indexOf(d)).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t))t=`${t.slice(8)}/${t.slice(5,7)}/${t.slice(0,4)}`;const m=t.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})$/);if(!m)return null;
  const v=`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`,d=new Date(v+"T00:00:00Z");return !isNaN(d)&&d.toISOString().slice(0,10)===v?v:null;}
function enhanceDates(){
  document.querySelectorAll('#app input[type=date]:not([data-enh])').forEach(inp=>{
    inp.dataset.enh="1";const box=document.createElement("div");box.className="dbox";
    const t=document.createElement("input");t.type="text";t.inputMode="numeric";t.placeholder="DD/MM/YYYY";t.autocomplete="off";t.dir="ltr";
    t.className="dtext "+(inp.className||"");t.value=toDMY(inp.value);if(inp.id){t.id=inp.id;inp.id=inp.id+"-native";}
    const b=document.createElement("button");b.type="button";b.className="dcal";b.setAttribute("aria-label","Open calendar");
    b.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9ZM8 13h3v3H8v-3Z"/></svg>';
    inp.classList.add("dnative");inp.tabIndex=-1;inp.setAttribute("aria-hidden","true");
    inp.parentNode.insertBefore(box,inp);box.append(t,b,inp);
    const push=v=>{inp.value=v;inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}));};
    b.addEventListener("click",e=>{e.stopPropagation();try{inp.showPicker();}catch(_){inp.style.pointerEvents="auto";inp.focus();inp.click();}});
    inp.addEventListener("change",()=>{t.value=toDMY(inp.value);t.classList.remove("badd");});
    t.addEventListener("change",()=>{if(!t.value.trim()){push("");return;}const v=fromDMY(t.value);
      if(!v||(inp.max&&v>inp.max)||(inp.min&&v<inp.min)){t.classList.add("badd");toast(v?"That date is outside the allowed range":"Write the date as DD/MM/YYYY",true);return;}
      t.classList.remove("badd");if(v!==inp.value)push(v);else t.value=toDMY(v);});
  });
}

/* ================= Actions ================= */
const val=id=>($("#"+id)?.value||"").trim();
function fail(msg){S.error=msg;render();}
async function doSetup(){
  const name=val("sn"),username=val("su").toLowerCase(),p=$("#sp").value,p2=$("#sp2").value;
  if(!name||!username)return fail("Enter your full name and a username.");
  if(p.length<6)return fail("Use a password of at least 6 characters.");
  if(p!==p2)return fail("The two passwords do not match.");
  const salt=newSalt();S.users=[{name,username,role:"team",salt,hash:await hashPw(p,salt)}];
  await sset("ipc-users",S.users);S.user=sessUser(S.users[0]);await sset("ipc-session",username);go("home");
}
async function doLogin(){
  const username=val("lu").toLowerCase(),p=$("#lp").value,u=S.users.find(x=>x.username===username);
  if(!S.users.length)return fail("No accounts exist yet. Use Create account below.");
  if(!u||await hashPw(p,u.salt)!==u.hash)return fail("Username or password is incorrect.");
  S.user=sessUser(u);await sset("ipc-session",u.username);go("home");autoActions();
}
async function addUser(){
  const name=val("nn"),username=val("nu").toLowerCase(),role=$("#nr").value,p=$("#np").value;
  if(!name||!username)return fail("Enter the full name and a username.");
  if(!/^[a-z0-9._-]{3,}$/.test(username))return fail("Usernames use 3 or more letters, numbers, dots, dashes or underscores, with no spaces.");
  if(S.users.some(u=>u.username===username))return fail("That username is already taken.");
  if(p.length<6)return fail("Use a temporary password of at least 6 characters.");
  const perms=readAccess();if(role==="link"&&!perms.mods.length)return fail("Tick at least one thing this link user can enter.");
  const salt=newSalt();S.users.push({name,username,role,salt,hash:await hashPw(p,salt),...(role==="link"?{perms}:{})});
  await sset("ipc-users",S.users);go("users");toast(`Added ${name}`);
}
async function resetPw(username){
  const p=prompt(`New temporary password for ${username} (6+ characters):`);if(p===null)return;
  if(p.length<6){toast("Password too short, not changed",true);return;}
  const u=S.users.find(x=>x.username===username);u.salt=newSalt();u.hash=await hashPw(p,u.salt);
  await sset("ipc-users",S.users);toast("Password reset");
}
async function changePw(){
  const u=S.users.find(x=>x.username===S.user.username);
  if(await hashPw($("#cp0").value,u.salt)!==u.hash)return fail("Current password is incorrect.");
  const p=$("#cp1").value;if(p.length<6)return fail("Use a new password of at least 6 characters.");
  if(p!==$("#cp2").value)return fail("The two new passwords do not match.");
  u.salt=newSalt();u.hash=await hashPw(p,u.salt);await sset("ipc-users",S.users);go("home");toast("Password changed");
}
function validate(t,f){
  if(!f.dept)return "Select a department.";
  if(f.dept==="Other"&&!f.deptOther.trim())return "Name the department.";
  if(f.dept==="General OPD"&&!f.specialty)return "Select the clinic specialty.";
  if(f.specialty==="Other specialty"&&!f.specialtyOther.trim())return "Name the specialty.";
  if(t==="hh"){
    if(f.dept==="Isolation rooms"&&!f.isoUnit)return "Select which isolation: ER, ICU, CCU or third floor.";
    if(!f.category)return "Select the staff category.";
    if(!f.moments.length)return "Select the moment observed.";
    if(!f.action)return "Select the hand hygiene action.";
    if(f.action==="missed"&&!f.gloves)return "Say whether the staff member was wearing gloves.";
    return "";
  }
  if(!f.locType)return "Choose patient room or area.";
  if(!f.room.trim())return f.locType==="Area"?"Select the area.":"Select or enter the room.";
  if(f.room==="Other area"&&!f.areaOther.trim())return "Name the area.";
  if(t==="ppe"&&!f.precautions.length)return "Select the precautions on the door.";
  if(t==="ppe"&&!f.category)return "Select the staff category.";
  if(t==="env"&&!f.cleanType)return "Select the cleaning type.";
  if(t==="env"&&!f.method)return "Select the method of checking.";
  if(t==="env"&&!f.seen.length)return "Choose housekeeping or healthcare provider.";
  if(t==="env")return "";
  const miss=CHECK[t].findIndex(i=>!f.items[i.k]);
  if(miss>-1)return `Answer item ${miss+1} of the checklist.`;
  const sm=subMiss(CHECK[t],f);
  if(sm>-1)return `Item ${sm+1}: select what was wrong.`;
  return "";
}
async function save(){
  const t=S.module,f=S.form,e=validate(t,f);if(e)return fail(e);
  if(t==="env")return saveEnv();
  const compliant=t==="hh"?f.action!=="missed":!Object.values(f.items).includes("n");
  const id=uid(),{photos,...data}=f,ph=photos||[];
  for(let i=0;i<ph.length;i++)await sset(`ipc-photo:${id}:${i}`,ph[i]);
  const rec={...JSON.parse(JSON.stringify(data)),id,ts:Date.now(),type:t,compliant,auditor:S.user.name,auditorUser:S.user.username,photoCount:ph.length};
  S.audits.push(rec);await sset("ipc-audits",S.audits);
  if(t==="hh"){S.session.n++;if(compliant)S.session.ok++;}
  S.form=freshForm(t,t==="hh"?f:{validation:f.validation,dept:f.dept,deptOther:f.deptOther,specialty:f.specialty,specialtyOther:f.specialtyOther,locType:f.locType,cleanType:f.cleanType,method:f.method,resp:f.resp});
  S.error="";render();toast(isTeam()?(compliant?"Saved: compliant":"Saved: not compliant"):"Saved",isTeam()&&!compliant);
}
async function saveEnv(){
  const f=S.form,prof=envProfile(f),tracks=[];
  for(const r of f.seen){const l=envList(prof,r);
    if(!l.length)return fail(`${r}: add at least one item to the checklist for this location, or leave it out.`);
    const items=Object.fromEntries(l.map(i=>[i.k,f.st[i.k]||"y"]));
    if(!Object.values(items).some(v=>v!=="na"))return fail(`${r}: every item is marked not available. Mark at least one clean or not clean, or leave it out.`);
    tracks.push({resp:r,items});}
  const {photos,st,seen,...data}=f,ph=photos||[],visit=uid();let first=null,bad=0;
  for(const tr of tracks){const id=uid()+tr.resp.slice(0,1);
    if(!first){first=id;for(let i=0;i<ph.length;i++)await sset(`ipc-photo:${id}:${i}`,ph[i]);}
    const compliant=!Object.values(tr.items).includes("n");if(!compliant)bad++;

function resizeImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.7));};
      img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

  if(/\bcre\b|cpe|kpc|ndm|oxa-?48|carbapenem/.test(t))return "CRE";if(/esbl|extended.?spectrum/.test(t))return "ESBL";return "";}

  if(/\ber\b|emergency|a ?& ?e/.test(lo))return "ER";if(/3rd|third|general ward|medical ward|surgical ward/.test(lo))return "General Ward (3rd Floor)";

  const t=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(t))return t.slice(0,10);const f=findDates(t);if(f.length)return f[0];
  const m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/);if(m)return `20${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;return "";}

function devMetrics(pS,pE,unit){
  const inU=u=>unit==="all"||u===unit,inP=x=>x>=pS&&x<pE,uAt=(pid,d,r)=>{const p=ptOf(pid);return p?unitAt(p,d,r):null;};
  const ptDays=S.patients.reduce((t,p)=>t+segs(p).filter(g=>inU(g.unit)).reduce((x,g)=>x+overlap(g.s,g.e,pS,pE),0),0);
  const devDays=d=>{const p=ptOf(d.patientId);if(!p)return 0;const end=d.removed||pE;return segs(p).filter(g=>inU(g.unit)).reduce((x,g)=>x+overlap(d.insertDate>g.s?d.insertDate:g.s,end<g.e?end:g.e,pS,pE),0);};
  const rows=Object.entries(DEV).map(([k,m])=>{const ds=S.devices.filter(d=>d.type===k),dd=ds.reduce((x,d)=>x+devDays(d),0);
    const ch=ds.flatMap(d=>d.checks.filter(c=>inP(c.date)&&inU(uAt(d.patientId,c.date))));
    const ev=S.events.filter(e=>e.status==="Confirmed HAI"&&inP(e.date)&&inU(uAt(e.patientId,e.date,true))).filter(e=>{const a=assess(e);return a.type===k&&a.kind==="flag";});
    return{k,m,dd,ch:ch.length,chOk:ch.filter(checkOk).length,hai:ev.length,rate:dd?ev.length/dd*1000:null,du:ptDays?dd/ptDays:null};});
  const ops=S.surg.filter(x=>inP(x.date)&&inU(uAt(x.patientId,x.date))),ids=new Set(ops.map(x=>x.id));
  const ssi=S.events.filter(e=>e.status==="Confirmed HAI").filter(e=>{const a=assess(e);return a.type==="ssi"&&a.kind==="flag"&&ids.has(a.procId);}).length;
  return{ptDays,rows,ops:ops.length,opsOk:ops.filter(surgOk).length,ssi};
}

async function backup(withPhotos){
  const keys=(await listKeys()).filter(k=>k!=="ipc-session"&&(withPhotos||!k.startsWith("ipc-photo:")));
  const data={};for(const k of keys)data[k]=await sget(k);
  const blob=new Blob([JSON.stringify({app:"alsobh-ipc",version:1,made:new Date().toISOString(),by:S.user.name,data})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`ipc-backup-${today()}${withPhotos?"-with-photos":""}.json`;a.click();
  S.settings.lastBackup=today();await sset("ipc-settings",S.settings);render();
}
async function restore(file,mode){
  let j;try{j=JSON.parse(await file.text());}catch(e){toast("That file is not a platform backup",true);return;}
  if(j.app!=="alsobh-ipc"||!j.data){toast("That file is not a platform backup",true);return;}
  const D=j.data,arr=["ipc-audits","ipc-actions","ipc-patients","ipc-devices","ipc-events","ipc-mdro","ipc-surg","ipc-log"];
  if(mode==="replace"){if(!confirm("Replace everything on this device with the backup? Current data on this device will be lost."))return;
    for(const k of await listKeys())if(k!=="ipc-session"&&!(k in D))await sdel(k);
    for(const [k,v] of Object.entries(D))await sset(k,v);}
  else{let added=0;
    for(const k of arr){const cur=(await sget(k))||[],ids=new Set(cur.map(x=>x.id||x.ts+"|"+x.label)),inc=(D[k]||[]).filter(x=>!ids.has(x.id||x.ts+"|"+x.label));added+=k==="ipc-log"?0:inc.length;
      const m=k==="ipc-log"?[...cur,...inc].sort((a,b)=>a.ts-b.ts):[...cur,...inc];await sset(k,m);}
    const cu=(await sget("ipc-users"))||[],nu=(D["ipc-users"]||[]).filter(u=>!cu.some(x=>x.username===u.username));await sset("ipc-users",[...cu,...nu]);
    for(const [k,v] of Object.entries(D))if(k.startsWith("ipc-photo:")&&(await sget(k))===null)await sset(k,v);
    for(const k of ["ipc-targets","ipc-bench","ipc-envcustom","ipc-census"])if(D[k]&&!(await sget(k)))await sset(k,D[k]);
    toast(`Merged ${added} new records${nu.length?` and ${nu.length} accounts`:""}`);}
  setTimeout(()=>location.reload(),900);
}
function vSettings(){
  const st=S.settings;
  return `<div class="wrap">${crumb("Data and settings")}
    <h1>Data and settings</h1>
    <p class="lead">Until the platform has a central server, each device keeps its own data. Use backups to keep data safe and to bring entries from several devices together.</p>
    <h2>Backup</h2>
    <div class="card"><p style="margin-top:0">Last backup on this device: <b>${st.lastBackup?fmt(st.lastBackup):"never"}</b>${!st.lastBackup||st.lastBackup<addDays(today(),-7)?` <span class="tag no">Due</span>`:""}</p>
      <div class="row"><div style="flex:0 0 auto"><button class="btn" data-a="backup">Download backup</button></div><div style="flex:0 0 auto"><button class="btn ghost" data-a="backupph">Backup with photos</button></div></div>
      <p class="hint">The file contains patient details. Keep it on a hospital computer or drive, not on personal storage.</p></div>
    <h2>Bring in data from another device</h2>
    <div class="card"><p style="margin-top:0">On the other device, download a backup and send the file here. <b>Merge</b> adds the entries this device does not have yet. <b>Replace</b> wipes this device and loads the backup.</p>
      <div class="row"><span class="btn ghost file-btn" style="flex:0 0 auto">Merge a backup<input type="file" accept=".json,application/json" data-restore="merge"></span>
        <span class="btn danger file-btn" style="flex:0 0 auto">Replace with a backup<input type="file" accept=".json,application/json" data-restore="replace"></span></div></div>
    <h2>Sign-out on shared devices</h2>
    <div class="card"><label class="f" style="margin-top:0" for="idle">Sign out after this many minutes without activity <small>(0 turns it off)</small></label>
      <input type="number" id="idle" min="0" max="240" value="${idleMin()}" style="max-width:140px"></div>
    <h2>Minimum sample per department per month</h2>
    <div class="card"><p style="margin-top:0" class="hint">The dashboard and monthly report flag departments below these numbers. WHO suggests about 200 hand hygiene opportunities per unit per period for a reliable rate.</p>
      <div class="row">${Object.entries(MODULES).map(([k,m])=>`<div><label class="f" for="sm-${k}">${m.name}</label><input type="number" min="0" id="sm-${k}" value="${sampleMin(k)}"></div>`).join("")}</div></div>
    <div style="margin-top:16px"><button class="btn" data-a="savesettings">Save settings</button></div>
    <h2>Activity log</h2>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>${S.log.length} recorded changes: who added, changed or deleted what, and when.</span><button class="btn ghost" data-a="nav" data-v="log">Open activity log</button></div>
  </div>`;
}
function vLog(){
  const q=(S.logQ||"").toLowerCase(),list=S.log.slice().reverse().filter(x=>!q||`${x.by} ${x.what} ${x.act} ${x.label} ${x.note||""}`.toLowerCase().includes(q));
  return `<div class="wrap wide">${crumb("Activity log",`<span>/</span><button data-a="nav" data-v="settings">Data and settings</button>`)}
    <h1>Activity log</h1>
    <p class="lead">Every addition, change and deletion, with the person and time. Entries cannot be edited.</p>
    <div class="row" style="align-items:end"><div><label class="f" for="logq">Search</label><input type="text" id="logq" value="${esc(S.logQ||"")}" placeholder="Name, unit, bed, audit…"></div>
      <div style="flex:0 0 auto"><button class="btn ghost" data-a="logcsv">Export to CSV</button></div></div>
    <div class="scroll" style="margin-top:12px"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Action</th><th>Details</th></tr></thead><tbody>
    ${list.slice(0,400).map(x=>`<tr><td style="white-space:nowrap">${new Date(x.ts).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(x.by)}</td><td>${esc(x.what)}</td>
      <td><span class="tag ${x.act==="Deleted"?"no":x.act==="Added"?"ok":"mid"}">${x.act}</span></td><td>${esc(x.label)}${x.note&&x.note!=="edited"?`<br><small>${esc(x.note)}</small>`:""}</td></tr>`).join("")||`<tr><td colspan="5">No changes recorded yet.</td></tr>`}
    </tbody></table></div>${list.length>400?`<p class="hint">Showing the latest 400 of ${list.length}. Export to see all.</p>`:""}</div>`;
}
function logcsv(){
  const rows=[["When","Who","What","Action","Details","Note"],...S.log.map(x=>[new Date(x.ts).toISOString(),x.by,x.what,x.act,x.label,x.note||""])];
  const t="\uFEFF"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));a.download=`ipc-activity-log-${today()}.csv`;a.click();
}

/* ================= Boot ================= */
(async()=>{
  S.users=(await sget("ipc-users"))||[];
  S.audits=(await sget("ipc-audits"))||[];
  S.actions=(await sget("ipc-actions"))||[];
  S.targets=(await sget("ipc-targets"))||{};
  S.bench=(await sget("ipc-bench"))||[];
  S.envCustom=(await sget("ipc-envcustom"))||{};
  S.patients=(await sget("ipc-patients"))||[];
  S.devices=(await sget("ipc-devices"))||[];
  S.events=(await sget("ipc-events"))||[];
  S.mdro=(await sget("ipc-mdro"))||[];
  S.census=(await sget("ipc-census"))||{};
  S.surg=(await sget("ipc-surg"))||[];
  S.log=(await sget("ipc-log"))||[];
  S.settings=(await sget("ipc-settings"))||{};
  Object.keys(TRACK).forEach(k=>{SNAP[k]=snapOf(mem[k]??({"ipc-audits":S.audits,"ipc-actions":S.actions,"ipc-patients":S.patients,"ipc-devices":S.devices,"ipc-events":S.events,"ipc-users":S.users,"ipc-mdro":S.mdro,"ipc-surg":S.surg})[k]);});
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.storage){navigator.serviceWorker.register("sw.js").catch(()=>{});}
  const sess=await sget("ipc-session"),u=S.users.find(x=>x.username===sess);
  if(u){S.user=sessUser(u);S.view="home";setTimeout(autoActions,500);}
  else S.view="login";
  render();
})();
</script>
