<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Communicable disease notification | Al-Sobh Hospital</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--sun:#F2C300;--ink:#2E3E47;--paper:#F3F8F8;--line:#CADCDD;--muted:#4F6670;--primary:#245E68;--go:#1E7B4F;--go-bg:#E5F3EC;--stop:#B42318;--stop-bg:#FBEAE8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45}
header{background:#D4E9E9;border-bottom:3px solid var(--sun)}
.hd{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd img{height:46px}
.hd .t{font-weight:800;font-size:1.05rem}.hd .s{color:var(--muted);font-size:.85rem}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.45rem;margin:6px 0 2px}.lead2{color:var(--muted);margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px}
.card h2{font-size:1.05rem;margin:0 0 6px;color:var(--primary)}
label{display:block;font-weight:700;margin:12px 0 4px}label small{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:3px solid #F2C30066;border-color:var(--primary)}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{color:var(--muted);font-size:.86rem;margin:4px 0 0}
.bad{border-color:var(--stop)!important}
.err{background:var(--stop-bg);color:var(--stop);border-radius:10px;padding:10px 12px;margin:12px 0;font-weight:600}
.btn{display:block;width:100%;background:var(--primary);color:#fff;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:1.05rem;cursor:pointer}
.btn[disabled]{opacity:.6}
.ok{background:var(--go-bg);border:1px solid #A9D5BD;border-radius:14px;padding:18px;text-align:center}
.ok b{font-size:1.4rem;color:var(--go);display:block;margin-bottom:6px}
.ref{font-family:ui-monospace,Consolas,monospace;font-size:1.3rem;letter-spacing:2px;background:#fff;border-radius:8px;padding:6px 12px;display:inline-block;margin:8px 0}
.hp{position:absolute;left:-9999px}
footer{color:var(--muted);font-size:.8rem;text-align:center;padding:10px}
.req{color:var(--stop)}
header.dual{background:#fff;border-bottom:4px solid #F2C300;display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 16px}
header.dual .hl{height:54px;max-width:46vw;object-fit:contain}header.dual .il{height:78px;max-width:30vw;object-fit:contain}
header.dual .sep{width:2px;align-self:stretch;margin:8px 0;background:#CADCDD}
@media(max-width:380px){header.dual .hl{height:44px}header.dual .il{height:64px}}
</style></head><body>

const DISEASES=["MERS-CoV","COVID-19","Influenza","Tuberculosis, pulmonary","Tuberculosis, extrapulmonary","Measles","Varicella (chickenpox)","Mumps","Rubella","Pertussis","Diphtheria","Meningococcal disease","Bacterial meningitis, other","Hepatitis A","Hepatitis B","Hepatitis C","Hepatitis E","HIV","Brucellosis","Dengue fever","Malaria","Typhoid or paratyphoid","Cholera","Food poisoning","Shigellosis","Leishmaniasis","Scabies","Mpox","Viral haemorrhagic fever","Acute flaccid paralysis","Tetanus","Legionellosis","Rabies or animal bite","Syphilis","Gonorrhoea","Other (write below)"];
const ISO=["Standard","Contact","Droplet","Airborne"];
const DEPTS=["ER","ICU","Psychiatry","Internal Medicine","Surgery","Pediatrics"];
const LOCS=["OPD","ER","ICU","General ward","Psychiatry ward"];
const NEED_ROOM=["ICU","General ward","Psychiatry ward"];
function sel(id,label,k,list,ph){return `<div><label for="${id}">${label} <span class="req">*</span></label><select id="${id}" data-k="${k}" class="${bad.includes(k)?"bad":""}"><option value="">${ph||"Choose…"}</option>${list.map(x=>`<option ${F[k]===x?"selected":""}>${x}</option>`).join("")}</select></div>`;}
const AR="٠١٢٣٤٥٦٧٨٩";const en=v=>String(v).replace(/[٠-٩]/g,d=>AR.indexOf(d));
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const F={reporter:"",empId:"",reporterDept:"",mrn:"",name:"",mobile:"",locUnit:"",room:"",status:"",date:today(),disease:"",diseaseOther:"",isolation:[],history:"",website:""};
let err="",bad=[],done=null,busy=false,db=null;
const $=s=>document.querySelector(s);
function field(id,label,k,opt={}){return `<div><label for="${id}">${label}${opt.req===false?" <small>(optional)</small>":' <span class="req">*</span>'}</label>
  <input id="${id}" data-k="${k}" value="${esc(F[k])}" ${opt.attrs||""} class="${bad.includes(k)?"bad":""}">${opt.hint?`<p class="hint">${opt.hint}</p>`:""}</div>`;}
function render(){
  if(done){$("#app").innerHTML=`<div class="ok"><b>&#10003; Notification sent</b>Thank you. The Infection Prevention and Control team has received it.<br>Reference<br><span class="ref">${done}</span><br><span class="hint">Keep the reference if you are asked about this notification.</span></div>
    <div style="margin-top:14px"><button class="btn" id="again">Send another notification</button></div>`;
    $("#again").onclick=()=>{done=null;Object.assign(F,{mrn:"",name:"",mobile:"",locUnit:"",room:"",status:"",date:today(),disease:"",diseaseOther:"",isolation:[],history:""});render();scrollTo(0,0);};return;}
  $("#app").innerHTML=`<h1>Communicable disease notification</h1><p class="lead2">For all healthcare workers at Al-Sobh Hospital.</p>
  <div class="card"><h2>Reported by</h2><div class="row">
    ${field("rn","Your full name","reporter",{attrs:'autocomplete="name" maxlength="80"'})}
    ${field("re","Employee number","empId",{attrs:'inputmode="numeric" maxlength="8"',hint:"8 digits"})}</div>
    <div class="row">${sel("rd","Your department","reporterDept",DEPTS)}</div></div>
  <div class="card"><h2>Patient</h2><div class="row">
    ${field("pm","Patient file number (MRN)","mrn",{attrs:'inputmode="numeric" maxlength="7"',hint:"7 digits, starts with 6"})}
    ${field("pn","Patient name","name",{attrs:'maxlength="100"'})}</div><div class="row">
    ${field("pp","Patient mobile number","mobile",{attrs:'inputmode="numeric" maxlength="10" dir="ltr" placeholder="05XXXXXXXX"',hint:"10 digits, starts with 0"})}
    ${sel("pl","Patient location","locUnit",LOCS)}</div>
    ${NEED_ROOM.includes(F.locUnit)?`<div class="row">${field("pr","Room number","room",{attrs:'maxlength="10" inputmode="numeric"',hint:`Required for ${F.locUnit}`})}</div>`:""}</div>
  <div class="card"><h2>Disease</h2>
    <label>Status <span class="req">*</span></label><div class="chips">${["Suspected","Confirmed"].map(x=>`<button type="button" class="chip" data-st="${x}" aria-pressed="${F.status===x}">${x}</button>`).join("")}</div>
    <div class="row"><div><label for="dd">${F.status==="Confirmed"?"Date confirmed":"Date suspected"} <span class="req">*</span></label><input type="date" id="dd" data-k="date" value="${F.date}" max="${today()}" class="${bad.includes("date")?"bad":""}"></div>
      <div><label for="ds">Suspected or confirmed disease <span class="req">*</span></label><select id="ds" data-k="disease" class="${bad.includes("disease")?"bad":""}"><option value="">Choose…</option>${DISEASES.map(d=>`<option ${F.disease===d?"selected":""}>${d}</option>`).join("")}</select></div></div>
    ${F.disease.startsWith("Other")?`<div class="row">${field("do","Write the disease","diseaseOther",{attrs:'maxlength="80"'})}</div>`:""}
    <label>Current isolation <span class="req">*</span> <small>(choose all that apply)</small></label>
    <div class="chips">${ISO.map(x=>`<button type="button" class="chip" data-iso="${x}" aria-pressed="${F.isolation.includes(x)}">${F.isolation.includes(x)?"&#10003; ":""}${x}</button>`).join("")}</div>
    <label for="hi">Brief history <span class="req">*</span> <small>(symptoms, onset, travel, contacts)</small></label>
    <textarea id="hi" data-k="history" maxlength="2000" class="${bad.includes("history")?"bad":""}" placeholder="e.g. Fever and cough for 3 days, returned from Umrah 5 days ago">${esc(F.history)}</textarea></div>
  <input class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" data-k="website" value="">
  ${err?`<div class="err" role="alert">${err}</div>`:""}
  <button class="btn" id="send" ${busy?"disabled":""}>${busy?"Sending…":"Send notification"}</button>`;
  document.querySelectorAll("[data-k]").forEach(el=>{el.oninput=el.onchange=()=>{let v=el.value;if(["empId","mrn","mobile"].includes(el.dataset.k)){v=en(v).replace(/\D/g,"");if(v!==el.value)el.value=v;}F[el.dataset.k]=v;if(bad.includes(el.dataset.k)){bad=bad.filter(k=>k!==el.dataset.k);el.classList.remove("bad");if(!bad.length){err="";document.querySelector(".err")?.remove();}}if(el.tagName==="SELECT")render();};});
  document.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{F.status=b.dataset.st;bad=bad.filter(k=>k!=="status");if(!bad.length)err="";render();});
  document.querySelectorAll("[data-iso]").forEach(b=>b.onclick=()=>{const v=b.dataset.iso;F.isolation=F.isolation.includes(v)?F.isolation.filter(x=>x!==v):[...F.isolation,v];if(F.isolation.length)bad=bad.filter(k=>k!=="isolation");if(!bad.length)err="";render();});
  $("#send").onclick=send;
}
function check(){
  bad=[];const t=k=>String(F[k]||"").trim();
  if(t("reporter").length<3)bad.push("reporter");
  if(!/^\d{8}$/.test(t("empId")))bad.push("empId");
  if(!/^6\d{6}$/.test(t("mrn")))bad.push("mrn");
  if(t("name").length<2)bad.push("name");
  if(!/^0\d{9}$/.test(t("mobile")))bad.push("mobile");
  if(!DEPTS.includes(F.reporterDept))bad.push("reporterDept");
  if(!LOCS.includes(F.locUnit))bad.push("locUnit");
  if(NEED_ROOM.includes(F.locUnit)&&!t("room"))bad.push("room");
  if(!F.status)bad.push("status");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(F.date)||F.date>today())bad.push("date");
  if(!F.disease)bad.push("disease");
  if(F.disease.startsWith("Other")&&t("diseaseOther").length<2)bad.push("diseaseOther");
  if(!F.isolation.length)bad.push("isolation");
  if(t("history").length<3)bad.push("history");
  const names={reporter:"your full name",empId:"your 8-digit employee number",reporterDept:"your department",locUnit:"the patient location",room:"the room number",mrn:"the patient file number (7 digits starting with 6)",name:"the patient name",mobile:"the patient mobile number (10 digits starting with 0)",status:"suspected or confirmed",date:"the date",disease:"the disease",diseaseOther:"the disease name",isolation:"the current isolation",history:"a brief history"};
  return bad.length?`Please complete: ${bad.map(k=>names[k]).join(", ")}.`:"";
}
async function send(){
  if(busy)return;err=check();if(err){render();(document.querySelector(".bad")||$(".err")).scrollIntoView({block:"center"});return;}
  if(F.website){done="OK";render();return;}
  if(!db){err="The form is not connected. Please contact the Infection Prevention and Control team.";render();return;}
  busy=true;render();
  try{
    const ref=db.collection("notify").doc(),t=k=>String(F[k]||"").trim();
    const d={id:ref.id,reporter:t("reporter"),empId:t("empId"),mrn:t("mrn"),name:t("name"),mobile:t("mobile"),status:F.status,date:F.date,disease:F.disease.startsWith("Other")?"Other":F.disease,isolation:ISO.filter(x=>F.isolation.includes(x)),history:t("history"),
      submitted:new Date().toISOString(),state:"New",ts:firebase.firestore.FieldValue.serverTimestamp()};
    d.reporterDept=F.reporterDept;d.locUnit=F.locUnit;
    if(NEED_ROOM.includes(F.locUnit)){d.room=t("room");d.location=`${F.locUnit}, room ${t("room")}`;}else d.location=F.locUnit;if(F.disease.startsWith("Other"))d.diseaseOther=t("diseaseOther");
    await Promise.race([ref.set(d),new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),20000))]);
    done=ref.id.slice(-6).toUpperCase();busy=false;err="";render();scrollTo(0,0);
    /* short alert to the infection control Teams channel, through the relay; no patient identifiers */
    const relay=window.IPC_CONFIG?.notifyRelay;
    if(relay){const dm=F.date.split("-").reverse().join("/"),now=new Date();
      fetch(relay,{method:"POST",keepalive:true,headers:{"Content-Type":"application/json"},body:JSON.stringify({ref:done,mrn:d.mrn,empId:d.empId,disease:d.disease==="Other"?d.diseaseOther:d.disease,status:d.status,location:d.location,reporterDept:d.reporterDept,date:dm,isolation:d.isolation.join(" + "),
        received:`${String(now.getDate()).padStart(2,"0")}/${String(now.getMonth()+1).padStart(2,"0")}/${now.getFullYear()} ${now.toTimeString().slice(0,5)}`})}).catch(()=>{});}
  }catch(e){busy=false;err=e&&e.code==="permission-denied"?"The notification was refused. Check the details and try again, or contact the Infection Prevention and Control team.":"Could not send. Check the internet connection and try again.";render();}
}
const load=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});
(async()=>{render();
  const cfg=window.IPC_CONFIG?.firebase;if(!cfg?.apiKey)return;
  try{const V="10.12.2";await load(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);await load(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
    const app=firebase.initializeApp(cfg,"notify");db=app.firestore();}catch(e){err="Could not load the form. Check the internet connection and reload the page.";render();}
})();
</script></body></html>
