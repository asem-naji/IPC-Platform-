<style>
:root{
  /* Al-Sobh identity: mist from the brand colour, slate and sunrise gold from the logo */
  --mist:#D4E9E9; --sun:#F2C300; --ink:#2E3E47; --paper:#F3F8F8; --surface:#FFFFFF; --line:#CADCDD; --muted:#4F6670; --primary:#245E68;
  --go:#1E7B4F; --go-bg:#E5F3EC; --stop:#B42318; --stop-bg:#FBEAE8; --na:#6B7A84; --warn-bg:#FFF6DB;
  --hh:#0F6E8C; --ppe:#5B4B9A; --waste:#C98A00; --env:#B5543A; --bundle:#8A9AA3;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.wrap.wide{max-width:1120px}
/* header: the logo's horizon bar becomes a gold line under the band */
header.bar{background:var(--mist);color:var(--ink);border-bottom:3px solid var(--sun)}
header.bar .wrap{padding:10px 16px;display:flex;flex-direction:row-reverse;align-items:center;gap:12px;justify-content:space-between;max-width:1120px}
.brand{display:flex;flex-direction:row-reverse;align-items:center;gap:14px;background:none;border:none;padding:0;text-align:right}
.brand img{height:46px;width:auto;display:block}
.brand span{border-right:1.5px solid rgba(46,62,71,.25);padding-right:14px;font-weight:700;font-size:1rem;line-height:1.2}
.brand span small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
@media (max-width:560px){.brand img{height:34px}.brand span{display:none}}
.who{font-size:.85rem;text-align:left;line-height:1.3}
.who button{background:rgba(255,255,255,.6);border:1px solid rgba(46,62,71,.3);color:var(--ink);border-radius:6px;padding:3px 9px;margin-top:4px;font-size:.8rem}
.who button:hover{background:#fff}
/* sign-in gate */
.gate{position:relative;overflow:hidden;background:var(--mist);border-bottom:3px solid var(--sun)}
.gate-sun{--o:.32;position:absolute;left:-90px;top:-40px;width:380px;opacity:var(--o);pointer-events:none}
@media (max-width:560px){.gate-sun{--o:.22;width:230px;left:-110px;top:-70px}}
.gate-in{position:relative;padding-top:36px;padding-bottom:66px}
.gate-logo{width:300px;max-width:72%;height:auto;display:block;margin:0 0 22px auto}
.gate h1{font-size:1.9rem;letter-spacing:-.01em;margin:0 0 6px}
.gate p.lead{margin:0;color:#3E5560}
.gate-card{position:relative;z-index:1;margin-top:-44px;box-shadow:0 10px 30px -12px rgba(36,94,104,.35)}
@media (prefers-reduced-motion:no-preference){.gate-sun{animation:rise 1.2s ease-out both}@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:var(--o)}}}
/* footer and ownership */
.foot{max-width:1120px;margin:0 auto;padding:18px 16px 84px;color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)}
.foot b{color:var(--ink);font-weight:700}
.role{display:inline-block;margin-top:2px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:700}
.role.team{background:#fff;color:var(--ink);border:1px solid rgba(46,62,71,.2)} .role.link{background:#FCEFB9;color:var(--ink)}
h1{font-size:1.6rem;line-height:1.2;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:1.18rem;margin:28px 0 8px}
h3{font-size:1rem;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
.crumb{display:flex;gap:6px;flex-wrap:wrap;font-size:.9rem;margin:4px 0 8px}
.crumb button,.link-btn{background:none;border:none;padding:0;color:var(--primary);text-decoration:underline}
.crumb span{color:var(--muted)}
.tiles{display:grid;gap:10px}
@media (min-width:900px){.tiles.grid{grid-template-columns:repeat(3,1fr)}.tiles.grid .tile{min-height:116px;align-items:flex-start}}
@media (min-width:600px) and (max-width:899px){.tiles.grid{grid-template-columns:1fr 1fr}}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c,var(--primary));border-radius:8px;padding:16px}
.tile b{display:block;font-size:1.08rem}
.tile span{color:var(--muted);font-size:.9rem}
.tile[disabled]{opacity:.55;cursor:default}
.tile .go{margin-left:auto;font-size:1.4rem;color:var(--muted)}
.tile .alert{color:var(--stop);font-weight:700}
label.f{display:block;font-weight:700;margin:16px 0 6px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:70px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{display:inline-block;border:none;border-radius:8px;padding:13px 18px;font-weight:700;background:var(--primary);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:#fff;color:var(--stop);border:1.5px solid #E7B9B4}
.btn.small{padding:7px 12px;font-size:.88rem}
.btn.block{width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.hint{color:var(--muted);font-size:.88rem;margin-top:6px}
.err{color:var(--stop);font-size:.92rem;margin-top:10px}
.draft{background:var(--warn-bg);border:1px solid #EBCB6B;border-radius:8px;padding:10px 12px;font-size:.88rem;margin:12px 0}

.zone{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.zone .pz{grid-column:2;grid-row:2;border:2px dashed var(--hh);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--hh);font-weight:700;min-height:92px;padding:6px;background:#EAF4F7}
.mom{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;text-align:left;min-height:72px;font-size:.88rem;line-height:1.25}
.mom i{font-style:normal;display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:var(--hh);color:#fff;font-weight:700;margin-bottom:4px}
.mom[aria-pressed=true]{background:var(--hh);border-color:var(--hh);color:#fff}
.mom[aria-pressed=true] i{background:#fff;color:var(--hh)}
.m1{grid-column:1;grid-row:2}.m2{grid-column:2;grid-row:1}.m3{grid-column:3;grid-row:1}.m4{grid-column:3;grid-row:2}.m5{grid-column:3;grid-row:3}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:14px 6px;font-weight:700}
.act.ok[aria-pressed=true]{background:var(--go);border-color:var(--go);color:#fff}
.act.no[aria-pressed=true]{background:var(--stop);border-color:var(--stop);color:#fff}

.yn{border-top:1px solid var(--line);padding:12px 0}
.yn:first-child{border-top:none}
.yn p{margin:0 0 8px}
.yn .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:440px}
.yn button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 4px;font-weight:700}
.yn button.y[aria-pressed=true]{background:var(--go);border-color:var(--go);color:#fff}
.yn button.n[aria-pressed=true]{background:var(--stop);border-color:var(--stop);color:#fff}
.yn button.x[aria-pressed=true]{background:var(--na);border-color:var(--na);color:#fff}

.photos{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.thumb{position:relative}
.thumb img{width:104px;height:104px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumb button{position:absolute;top:4px;right:4px;background:rgba(16,41,59,.85);color:#fff;border:none;border-radius:6px;font-size:.75rem;padding:3px 7px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.tally{position:sticky;bottom:0;background:var(--ink);color:#fff;border-radius:10px;padding:12px 16px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tally b{font-size:1.4rem}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--go);color:#fff;padding:14px 20px 14px 16px;border-radius:12px;font-weight:700;font-size:1.02rem;z-index:60;display:flex;align-items:center;gap:10px;box-shadow:0 8px 28px rgba(0,0,0,.22);max-width:min(92vw,520px);animation:tin .25s ease-out}
.toast .ti{flex:0 0 28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:1.05rem}
.toast.bad{background:var(--stop)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
.just-saved{animation:jsv 2.4s ease-out}
@keyframes jsv{0%{box-shadow:0 0 0 3px var(--go);background:#E6F4EA}100%{box-shadow:none}}
body.saving [data-a^="save"],body.saving [data-a="removedev"]{opacity:.55;pointer-events:none}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:760px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--line);border-top:5px solid var(--c);border-radius:8px;padding:12px}
.stat b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.stat small{display:block;font-size:.78rem;color:var(--muted)}
.stat .met{color:var(--go);font-weight:700;font-size:.8rem}
.stat .miss{color:var(--stop);font-weight:700;font-size:.8rem}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.charts{grid-template-columns:1fr}}
.chart{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}
.chart svg{width:100%;height:auto;display:block}
table{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff}
th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#E6F1F1;white-space:nowrap}
td.c{text-align:center;font-variant-numeric:tabular-nums}
td.c small{display:block;color:var(--muted);font-size:.75rem}
td.good{background:var(--go-bg)} td.bad{background:var(--stop-bg)} td.none{color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78rem;font-weight:700;white-space:nowrap}
.tag.ok{background:var(--go-bg);color:var(--go)} .tag.no{background:var(--stop-bg);color:var(--stop)} .tag.mid{background:var(--warn-bg);color:#7A5600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row > *{flex:1;min-width:160px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.fails{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.fails{grid-template-columns:1fr}}
.fails ol{margin:6px 0 0;padding-left:20px;font-size:.9rem}
.fails li{margin-bottom:4px}
.action{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:14px;margin-bottom:10px}
.action.over{border-left-color:var(--stop)}
.action p{margin:4px 0}
.modal{position:fixed;inset:0;background:rgba(16,41,59,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal .inner{background:#fff;border-radius:10px;padding:12px;width:min(94vw,960px);max-height:90vh;overflow:auto}
.modal .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
.modal img{width:100%;border-radius:6px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.mom{font-size:.8rem;padding:8px 6px}}
.pt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.bedno{flex:0 0 64px;height:64px;border-radius:10px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.bedno b.long{font-size:.95rem;text-align:center}
.scanbox{background:#EAF4F7;border:1px solid #BFDCE5;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.scanbox .row{margin-top:8px}
.filled{border-color:#1E7B4F!important;box-shadow:0 0 0 2px #E5F3EC}
.bedno small{font-size:.7rem;opacity:.75}.bedno b{font-size:1.5rem}
.meta{color:var(--muted);font-size:.88rem;font-weight:400}
.pt .meta{display:block}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;border:1.5px solid var(--c);border-left-width:6px}
.pill.done{background:var(--go-bg);color:var(--go)} .pill.due{background:#fff;color:var(--stop)} .pill.watch{background:var(--warn-bg);color:#7A5600} .pill.none{border-color:var(--line);color:var(--muted)}
.dev{background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:14px;margin-bottom:10px}
.dev p{margin:4px 0}
.subs{margin:10px 0 2px;padding:10px 12px;background:var(--stop-bg);border-radius:8px}
.subs p{margin:0 0 8px;font-size:.88rem;font-weight:700;color:var(--stop)}
.subs .chip{padding:7px 12px;font-size:.88rem}
.subs .chip[aria-pressed=true]{background:var(--stop);border-color:var(--stop);color:#fff}
.envgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px}
.envx{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:11px 12px;text-align:left;font-size:.92rem;line-height:1.3}
.envx small{display:block;font-size:.75rem;color:var(--go);font-weight:700;margin-top:2px}
.envx[aria-pressed=true]{background:var(--stop);border-color:var(--stop);color:#fff}
.envx[aria-pressed=true] small{color:#fff}
.envx.na{background:#EDF1F3;border-style:dashed;color:var(--na)}
.envx.na span{text-decoration:line-through}
.envx.na small{color:var(--na)}
.rm{position:absolute;bottom:9px;right:10px;font-size:.75rem;color:var(--stop);text-decoration:underline;background:none;border:none;padding:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin:6px 0 2px}
.pill.adh{background:#fff;color:#7A5600;border-style:dashed}
.bench input{padding:8px;min-width:70px}
.bench th,.bench td{vertical-align:middle}
td.c.tgt{font-weight:700}
/* assistant */
.ai-fab{position:fixed;right:18px;bottom:18px;z-index:30;width:62px;height:62px;border-radius:50%;background:var(--primary);color:#fff;border:3px solid var(--sun);box-shadow:0 12px 28px -10px rgba(36,94,104,.6);display:grid;place-items:center}
.ai-fab:hover{transform:translateY(-1px)}
.ai-panel{position:fixed;right:16px;bottom:16px;z-index:31;width:min(430px,calc(100vw - 32px));height:min(640px,calc(100vh - 32px));background:#fff;border-radius:16px;border:1px solid var(--line);box-shadow:0 28px 70px -24px rgba(36,94,104,.55);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:700px){.ai-panel{right:0;left:0;bottom:0;width:100%;height:86vh;border-radius:18px 18px 0 0}}
.ai-head{background:var(--mist);border-bottom:3px solid var(--sun);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.ai-head b{display:block;font-size:1.05rem}.ai-head small{display:block;color:var(--muted);font-size:.8rem}
.ai-x{width:36px;height:36px;border-radius:50%;border:1px solid rgba(46,62,71,.25);background:rgba(255,255,255,.7);font-size:1.3rem;line-height:1}
.ai-lang{border:1px solid rgba(46,62,71,.25);background:#fff;border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700}
.ai-log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.ai-empty p{color:var(--muted);margin:2px 0 10px;font-size:.92rem}
.ai-hint{display:block;width:100%;text-align:start;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.88rem;color:var(--ink)}
.ai-msg{max-width:88%;padding:10px 12px;border-radius:14px;font-size:.92rem;line-height:1.45;white-space:pre-wrap}
.ai-msg.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-msg.bad{border-color:var(--stop);color:var(--stop)}
.ai-msg ul{margin:6px 0 0;padding-left:18px;white-space:normal;font-size:.86rem}
.ai-miss{margin:6px 0 0;color:#7A5600;font-size:.82rem;white-space:normal}
.ai-review{margin-top:8px;border:none;background:var(--mist);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:700;font-size:.85rem}
.ai-dots{display:flex;gap:5px}.ai-dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4}
@media (prefers-reduced-motion:no-preference){.ai-dots span{animation:blink 1s infinite}.ai-dots span:nth-child(2){animation-delay:.2s}.ai-dots span:nth-child(3){animation-delay:.4s}@keyframes blink{50%{opacity:1}}
  .ai-mic.on{animation:pulse 1.4s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(180,35,24,.5)}70%{box-shadow:0 0 0 12px rgba(180,35,24,0)}100%{box-shadow:0 0 0 0 rgba(180,35,24,0)}}}
.ai-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;background:#fff}
.ai-foot textarea{flex:1;resize:none;min-height:48px;max-height:130px;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:.95rem}
.ai-mic,.ai-send{width:48px;height:48px;flex:0 0 48px;border-radius:50%;border:none;display:grid;place-items:center}
.ai-mic{background:var(--mist);color:var(--ink)}.ai-mic.on{background:var(--stop);color:#fff}
.ai-send{background:var(--primary);color:#fff}.ai-send:disabled{opacity:.5}
.foot{padding-right:96px}
.hgroup{margin-top:22px}.hgroup:first-of-type{margin-top:10px}
.hgroup h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink);margin:0 0 10px;font-weight:700;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hgroup h2 small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);font-size:.85rem}
.hnum{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:.8rem;letter-spacing:0;align-self:center}
.hnum:empty{display:none}
.hgroup .tiles.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.hgroup .tile{min-height:0}
.subnav{margin-top:6px}
.isogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card.iso{border-left:5px solid #7A3E9D}.iso-h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.spc{margin:0}.spc figcaption{margin-bottom:6px}.spc svg{width:100%;height:auto}
table.abg thead th{white-space:nowrap;font-size:.8rem}
td.mid{background:#FFF1CC}
.cmt{margin-top:8px;font-size:.9rem;padding:9px 11px}
.rep-head{display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:16px;border-bottom:3px solid var(--sun);padding-bottom:12px;margin-bottom:6px}
.rep-head img{height:58px}.rep-head h1{margin:0;font-size:1.45rem}.rep-head p{margin:4px 0 0;color:var(--muted)}
.rep section{break-inside:avoid-page}
.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:40px}.sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:.85rem;color:var(--muted)}
@media print{
  @page{size:A4;margin:14mm}
  header.bar,.foot,#ai-root,.noprint,.toast{display:none!important}
  html,body{background:#fff}
  .wrap.wide{max-width:none;padding:0}
  .rep h2{font-size:1.05rem;margin:18px 0 6px}
  table{font-size:.74rem}th,td{padding:4px 6px!important}
  .scroll{overflow:visible}
  td.good,td.bad{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.alert-box{background:#FBEAE8;border:1px solid #F0B8B2;border-left:6px solid var(--stop);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.alert-box.warn{background:#FFF6E5;border-color:#E9C877;border-left-color:#C98A00}
.pill.long{background:#FFF1CC;border-color:#E3B341;color:#6B4A00}
.crit{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #EEF3F3;cursor:pointer}
.crit input{width:20px;height:20px;margin-top:2px;flex:0 0 20px}
.crit-h{font-weight:700;margin:14px 0 4px}.card .crit-h:first-child{margin-top:0}
.dbox{position:relative;display:flex;gap:6px;align-items:stretch}
.dbox .dtext{flex:1;min-width:0}
.dbox .dcal{flex:0 0 46px;border:1.5px solid var(--line);background:#fff;border-radius:8px;display:grid;place-items:center;color:var(--primary)}
.dbox .dnative{position:absolute;right:0;top:0;width:46px;height:100%;opacity:0.011;border:0;padding:0;margin:0;z-index:2;cursor:pointer;-webkit-appearance:none;appearance:none;background:transparent;color:transparent;font-size:16px}
.dbox .dnative::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.dtext.badd{border-color:var(--stop)!important}

async function cloudSet(k,v){
  try{
    if(COL[k]){
      const col=db.collection(COL[k]),old=CSNAP[k]||{},now={},ops=[];
      for(const x of v||[]){const id=x.id||x.uid||x.username;if(!id)continue;const d=k==="ipc-users"?userToProfile(x):clean(x);now[id]=JSON.stringify(d);if(old[id]!==now[id])ops.push(["set",id,d]);}
      for(const id of Object.keys(old))if(!(id in now))ops.push(k==="ipc-users"?["update",id,{active:false}]:["delete",id]);
      CSNAP[k]=k==="ipc-users"?{...now,...Object.fromEntries(Object.keys(old).filter(id=>!(id in now)).map(id=>[id,old[id]]))}:now;
      for(let i=0;i<ops.length;i+=400){const b=db.batch();ops.slice(i,i+400).forEach(([op,id,d])=>op==="delete"?b.delete(col.doc(id)):op==="update"?b.update(col.doc(id),d):b.set(col.doc(id),d));b.commit().catch(cloudErr);}
      return;
    }
    if(CONF[k]){db.collection("config").doc(CONF[k]).set({v:clean(v)}).catch(cloudErr);return;}
    if(k.startsWith("ipc-photo:")){db.collection("photos").doc(photoDoc(k)).set({data:v}).catch(cloudErr);return;}
  }catch(e){cloudErr(e);}
}

}

function stopListening(){unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];loaded=new Set();}
function listen(){

  const team=isTeam();
  const uidv=auth.currentUser.uid,role=S.user.role,depts=S.user.perms?.depts||[];
  if(team){on("ipc-audits",db.collection("audits"));on("ipc-actions",db.collection("actions"));on("ipc-mdro",db.collection("mdro"));on("ipc-users",db.collection("users"));
    ["ipc-notify","ipc-risk","ipc-outbreaks","ipc-iso","ipc-expo","ipc-fit","ipc-train","ipc-sched","ipc-ast"].forEach(k=>on(k,db.collection(COL[k])));}
  else if(role==="unit"&&depts.length){on("ipc-audits",db.collection("audits").where("dept","in",depts.slice(0,30)));on("ipc-actions",db.collection("actions").where("dept","in",depts.slice(0,30)));
    on("ipc-patients",db.collection("patients").where("unit","in",depts.slice(0,30)));on("ipc-devices",db.collection("devices"));on("ipc-events",db.collection("events"));on("ipc-surg",db.collection("surg"));}
  else{on("ipc-audits",db.collection("audits").where("auditorUser","==",uidv));on("ipc-sched",db.collection("sched").where("assignee","==",uidv));}
  if(!team)unsubs.push(db.collection("users").doc(auth.currentUser.uid).onSnapshot(d=>{if(d.exists){const p=d.data();if(p.active===false){cloudLogout("Your account has been removed.");return;}applyServer("ipc-users",[p]);S.user=sessUser(profileToUser(p));scheduleRender();}}));

  Object.entries(CONF).forEach(([key,name])=>unsubs.push(db.collection("config").doc(name).onSnapshot(d=>{const v=d.exists?d.data().v:null;
    S[SKEY[key]]=v??(key==="ipc-bench"?[]:{});mem[key]=S[SKEY[key]];loaded.add(key);scheduleRender();},()=>loaded.add(key))));

    case "ipc-audits":return `${MODULES[x.type]?.name||x.type}, ${deptName(x)}${locName(x)?`, ${locName(x)}`:""}, ${fmt(x.date)}`;
    case "ipc-actions":return `${MODULES[x.module]?.name||"General"}, ${x.dept}: ${String(x.issue||"").slice(0,70)}`;
    case "ipc-patients":return `${x.unit} bed ${x.bed}, MRN ${x.mrn}`;
    case "ipc-devices":{const p=S.patients.find(y=>y.id===x.patientId);return `${DEV[x.type]?.name||x.type}${p?`, ${p.unit} bed ${p.bed}`:""}`;}
    case "ipc-events":{const p=S.patients.find(y=>y.id===x.patientId);return `${x.specimen} culture ${fmt(x.date)}, ${x.organism}${p?`, ${p.unit} bed ${p.bed}`:""}`;}
    case "ipc-users":return `${x.name} (${x.username}), ${ROLES[x.role]}`;
    case "ipc-mdro":return `${x.mdroType||"MDRO"} ${x.organism||""}, ${x.unit||""}, ${fmt(x.date)}`;
    case "ipc-surg":{const p=S.patients.find(y=>y.id===x.patientId);return `${x.procedure}, ${fmt(x.date)}${p?`, ${p.unit} bed ${p.bed}`:""}`;}
    case "ipc-outbreaks":return `${x.name}`;
    case "ipc-iso":return `${x.unit} bed ${x.bed}, ${(x.precautions||[]).join(" + ")}`;
    case "ipc-expo":return `${x.type}, ${x.dept}, ${fmt(x.date)}`;
    case "ipc-fit":return `${x.staffName}, ${x.model}, ${fmt(x.date)}`;
    case "ipc-train":return `${x.topic}, ${x.dept}, ${fmt(x.date)}`;
    case "ipc-notify":return `${ntDisease(x)}, ${x.name}, MRN ${x.mrn}`;

function changeNote(k,a,b){
  if(k==="ipc-devices"){if((b.checks||[]).length>(a.checks||[]).length)return "daily check saved";if(!a.removed&&b.removed)return `removed ${fmt(b.removed)}`;if((b.adh||[]).length>(a.adh||[]).length)return "adherence monitoring saved";}
  if(k==="ipc-events"&&a.status!==b.status)return `review: ${b.status}`;
  if(k==="ipc-actions"&&a.status!==b.status)return `status: ${b.status}`;
  if(k==="ipc-patients"){if(a.status!==b.status)return `${b.outcome||"discharged"}`;if(a.unit!==b.unit||a.bed!==b.bed)return `moved to ${b.unit} bed ${b.bed}`;}
  if(k==="ipc-users"){if(a.hash!==b.hash)return "password changed";if(JSON.stringify(a.perms)!==JSON.stringify(b.perms))return "access changed";}
  return "edited";
}
function trackDiff(k,v){
  const old=SNAP[k]||{},now=snapOf(v),ts=Date.now(),by=S.user.name,what=TRACK[k],add=[];
  for(const [id,j] of Object.entries(now)){if(!(id in old))add.push({ts,by,what,act:"Added",label:logLabel(k,JSON.parse(j))});
    else if(old[id]!==j)add.push({ts,by,what,act:"Changed",label:logLabel(k,JSON.parse(j)),note:changeNote(k,JSON.parse(old[id]),JSON.parse(j))});}
  for(const [id,j] of Object.entries(old))if(!(id in now))add.push({ts,by,what,act:"Deleted",label:logLabel(k,JSON.parse(j))});
  SNAP[k]=now;if(!add.length)return;
  S.log=[...(S.log||[]),...add].slice(-6000);
  if(CLOUD){cloudLog(add);return;}
  (async()=>{mem["ipc-log"]=S.log;try{if(window.storage)await window.storage.set("ipc-log",JSON.stringify(S.log),false);else if(LS)LS.setItem("ipc-log",JSON.stringify(S.log));}catch(e){}})();
}

/* ================= Password hashing ================= */
async function hashPw(pw,salt){
  const s=salt+"::"+pw;
  try{if(crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}}catch(e){}
  let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<s.length;i++){h1=Math.imul(h1^s.charCodeAt(i),16777619);h2=Math.imul(h2^s.charCodeAt(i),2246822507);}
  return "f"+(h1>>>0).toString(16)+(h2>>>0).toString(16);
}

function go(view,extra={}){
  if(TEAM_ONLY.includes(view)&&!isTeam())view="home";
  if(MASTER_ONLY.includes(view)&&!isMaster())view="home";
  if(isPrac()&&!canScreen(screenKey(view)))view="home";
  if(S.user?.role==="unit"&&!["home","scorecard","changepw","login"].includes(view))view="home";
  if(view==="scorecard"&&!(isTeam()||S.user?.role==="unit"))view="home";
  if(BUNDLE_VIEWS.includes(view)&&!canMod("bundles"))view="home";
  if(MODULES[view]&&!canMod(view))view="home";
  if(view==="round"&&!allowedUnits().includes(S.round.unit))S.round.unit=allowedUnits()[0];
  if(view==="setup"&&(CLOUD?S.ownerExists:S.users.length))view="login";
  if(view==="log"&&CLOUD)fetchLog();
  if(view==="home"&&S.startHash==="#notify"&&isTeam()){S.startHash="";view="notify";try{history.replaceState(null,"",location.pathname);}catch(_){}}
  const from=S.view,isBack=extra.__back;delete extra.__back;
  if(!isBack&&from&&from!==view&&S.user&&!["login","setup"].includes(from)){
    /* remember where we came from; form screens are skipped on the way back so a saved form is never reopened */
    (S.hist=S.hist||[]).push({view:from,pid:S.pid,did:S.did,ntId:S.ntId,isForm:!!S.histForm&&from!=="notifyone"});
    if(S.hist.length>40)S.hist.shift();
    try{history.pushState({ipc:S.hist.length},"");}catch(_){}
  }
  S.histForm=!!extra.form;if(view!=="device"){S.rmConfirm=null;S.rmErr=null;}
  if(view==="home")S.hist=[];
  Object.assign(S,{view,error:""},extra);render();window.scrollTo(0,0);
}
/* run once at a time: a double tap cannot save twice */
const once=fn=>{let busy=false;return async(...a)=>{if(busy)return;busy=true;document.body.classList.add("saving");try{return await fn(...a);}finally{setTimeout(()=>{busy=false;document.body.classList.remove("saving");},700);}};};
function goBack(){
  const h=S.hist||[];let t;
  while((t=h.pop())&&(t.isForm||(t.view===S.view&&t.pid===S.pid&&t.did===S.did)));
  if(!t){go("home",{__back:true});return;}
  if(t.view==="notifyone"){const x=S.notify.find(y=>y.id===t.ntId);if(x){S.ntId=x.id;go("notifyone",{form:ntForm(x),__back:true});return;}}
  go(t.view,{pid:t.pid,did:t.did,__back:true});
}

/* draft a corrective action when a department stays below target two complete months in a row */
async function autoActions(){
  if(!isTeam())return;
  const m1=prevMonth(monthKey(today())),m2=prevMonth(m1);let made=0;
  for(const k of Object.keys(MODULES)){
    const depts=[...new Set(S.audits.filter(a=>a.type===k&&[m1,m2].includes(monthKey(a.date))).map(deptName))];
    for(const d of depts){
      const r=m=>{const l=S.audits.filter(a=>a.type===k&&deptName(a)===d&&monthKey(a.date)===m);return{n:l.length,p:pctN(l.filter(a=>a.compliant).length,l.length)};};
      const a1=r(m1),a2=r(m2),tg=target(k),key=`${k}|${d}|${m1}`;
      if(a1.n>=5&&a2.n>=5&&a1.p<tg&&a2.p<tg&&!S.actions.some(x=>x.autoKey===key)){
        S.actions.push({id:uid(),created:today(),module:k,dept:d,auto:true,autoKey:key,
          issue:`${MODULES[k].name} below the ${tg}% target two months running: ${a2.p}% in ${monthName(m2)} (n=${a2.n}) and ${a1.p}% in ${monthName(m1)} (n=${a1.n}).`,
          action:"",owner:"",due:addDays(today(),14),status:"Open",by:"Platform"});made++;}
    }
  }
  if(made){await sset("ipc-actions",S.actions);toast(`${made} corrective action ${made===1?"draft":"drafts"} created`);}
}

function hhMatrix(list){
  const hh=list.filter(a=>a.type==="hh"),tg=target("hh");
  const cell=(l)=>{const n=l.length,v=pctN(l.filter(a=>a.compliant).length,n);return n?`<td class="c ${v>=tg?"good":"bad"}">${v}%<small>n=${n}</small></td>`:`<td class="c none">–</td>`;};
  if(!hh.length)return `<div class="card">No hand hygiene observations for this filter.</div>`;
  const rows=STAFF.map(s=>{const l=hh.filter(a=>a.category===s);return `<tr><th scope="row">${s}</th>${MOMENTS.map(m=>cell(l.filter(a=>a.moments.includes(m.n)))).join("")}${cell(l)}</tr>`;}).join("");
  return `<div class="scroll"><table><thead><tr><th>Profession</th>${MOMENTS.map(m=>`<th title="${m.full}">Moment ${m.n}</th>`).join("")}<th>All moments</th></tr></thead><tbody>${rows}
    <tr><th scope="row">All staff</th>${MOMENTS.map(m=>cell(hh.filter(a=>a.moments.includes(m.n)))).join("")}${cell(hh)}</tr></tbody></table></div>
    <p class="hint">Green cells meet the ${tg}% target, red cells fall below it. Observations covering two moments count under both.
    ${(()=>{const m=hh.filter(a=>a.action==="missed");return m.length?` Missed opportunities: ${m.length}, of which ${m.filter(a=>a.gloves==="With gloves").length} with gloves on and ${m.filter(a=>a.gloves==="Without gloves").length} without gloves.`:"";})()}</p>`;
}
function topFails(list,type){
  const items=CHECK[type],l=list.filter(a=>a.type===type);
  const rows=items.map(i=>{const ans=l.filter(a=>a.items[i.k]&&a.items[i.k]!=="na");const nos=ans.filter(a=>a.items[i.k]==="n");return{t:i.t,no:nos.length,n:ans.length,why:topReason(nos,i.k)};})
    .filter(r=>r.no).sort((a,b)=>b.no/b.n-a.no/a.n).slice(0,3);
  return `<div class="card"><h3 style="color:${MODULES[type].hex}">${MODULES[type].name}</h3>${rows.length?`<ol>${rows.map(r=>`<li>${esc(r.t)}: failed ${r.no} of ${r.n} (${pct(r.no,r.n)})${r.why}</li>`).join("")}</ol>`:`<p class="hint">No failed items for this filter.</p>`}</div>`;
}

function detail(a){
  const sid=a.staffId?`, staff ID ${esc(a.staffId)}`:"";
  if(a.type==="hh")return `${esc(catName(a))}${sid}${a.isoUnit?`, ${esc(a.isoUnit)} isolation`:""}${specName(a)?`, ${esc(specName(a))}`:""}, moment ${a.moments.join(" + ")}, ${HH_ACTIONS.find(x=>x.k===a.action).l.toLowerCase()}${a.gloves?` (${a.gloves.toLowerCase()})`:""}`;
  const fails=CHECK[a.type].filter(i=>a.items[i.k]==="n").map(i=>withWhy(i,a));
  const head=a.type==="ppe"?`${esc(catName(a))}${sid}, ${esc(precName(a))}, ${esc(locName(a))}`
    :a.type==="env"?`${esc(locName(a))}, ${esc(a.cleanType)}, ${esc(a.method||"")}${a.resp?`, ${esc(a.resp.toLowerCase())}`:""}`:esc(locName(a));
  return head+(fails.length?`<br><small>${a.type==="env"?"Not clean":"Failed"}: ${fails.map(esc).join("; ")}</small>`:"");
}

const Dt=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));

/* unit stays: one segment per unit/bed stay, end date exclusive */
function segs(p){const h=p.bedHistory||[],out=[];let st=p.admitDate;
  h.forEach(x=>{out.push({unit:x.unit,s:st,e:x.until});st=x.until;});
  out.push({unit:p.unit,s:st,e:p.status==="discharged"?p.discharged:addDays(today(),1)});return out;}
/* unit on a date; with transfer rule, an event on the transfer day or the next day goes to the transferring unit */
function unitAt(p,date,rule){const g=segs(p);let i=g.findIndex(x=>date>=x.s&&date<x.e);if(i<0)i=date<g[0].s?0:g.length-1;
  if(rule)for(let j=i;j>0&&dayDiff(g[j].s,date)<=1;j--){if(g[j-1].unit!==g[j].unit)return g[j-1].unit;}
  return g[i].unit;}
const OUTCOMES=["Discharged home","Transferred to another ward","Transferred to another hospital","Death","Discharged against medical advice"];

const WARDS=()=>[...BUNDLE_UNITS,"Male Psychiatry","Female Psychiatry","Other"];
/* device in the attribution window: removed today or yesterday */
const inWatch=d=>d.removed&&dayDiff(d.removed,today())<=1;

/* ---------- NHSN-style device association screen ---------- */
function assess(ev){
  const p=ptOf(ev.patientId),E=ev.date,type=SPECIMENS.find(s=>s[0]===ev.specimen)?.[1];
  const hd=p?hospDay(p,E):null;
  const out={hd,type,deviceId:null,kind:"info",label:"",why:""};
  if(type==="ssi"){
    const pr=S.surg.filter(x=>x.patientId===ev.patientId&&x.date<=E).sort((a,b)=>b.date.localeCompare(a.date));
    const hit=pr.find(x=>dayDiff(x.date,E)+1<=(x.implant==="Yes"?90:30));
    if(hit){out.kind="flag";out.procId=hit.id;out.label="Possible SSI";
      out.why=`${hit.procedure} on ${fmt(hit.date)}; the date of event is post-operative day ${dayDiff(hit.date,E)+1}, inside the ${hit.implant==="Yes"?"90":"30"}-day surveillance window. Apply the SSI criteria.`;return out;}
    out.label=pr.length?"Outside the SSI window":"No surgical procedure recorded";
    out.why=pr.length?`The last recorded procedure was on ${fmt(pr[0].date)}, outside the 30-day window (90 days with an implant).`:"Record the operation on the patient's page to screen this culture for SSI.";return out;}
  if(hd!==null&&hd<3){out.kind="poa";out.label="Present on admission window";
    out.why=`Date of event is hospital day ${hd}. Events before day 3 of admission fall in the present-on-admission window and are not counted as HAI.`;return out;}
  if(!type){out.label="Not linked to a monitored device";out.why="Specimen type is not linked to a urinary catheter, central line or ventilator. Assess for other HAI types.";return out;}
  const types=type==="mv"?["mv","pv"]:[type];
  const cands=devsOf(ev.patientId).filter(d=>types.includes(d.type)&&d.insertDate<=E);
  for(const d of cands){
    const daysOnE=devDay(d,d.removed&&d.removed<E?d.removed:E);
    const inPlace=!d.removed||d.removed>=addDays(E,-1);
    if(inPlace&&daysOnE>2){
      const T=d.type;out.type=T;
      out.kind="flag";out.deviceId=d.id;out.label=`Possible ${DEV[T].hai}`;
      out.why=d.removed&&d.removed<E
        ?`${DEV[T].name} was in place ${daysOnE} days and removed on ${fmt(d.removed)}, the day before the date of event, so it still counts. Apply the full ${DEV[T].hai} criteria.`
        :`${DEV[T].name} in place for more than 2 days on the date of event (device day ${devDay(d,E)}). Apply the full ${DEV[T].hai} criteria.`;
      return out;
    }
  }
  if(cands.length){out.label=`Not device-associated by timing`;
    out.why=`A ${DEV[type].name.toLowerCase()} was present, but it was either in place 2 days or fewer on the date of event, or removed more than 1 day before it.`;return out;}
  out.label=`No ${DEV[type].name.toLowerCase()} recorded`;out.why=`No ${DEV[type].name.toLowerCase()} on record before the date of event. Assess for non-device HAI if criteria are met.`;
  return out;
}

const LIBS={zxing:"https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js",tess:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"};
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const x=document.createElement("script");x.src=src;x.onload=res;x.onerror=()=>rej(new Error("load"));document.head.appendChild(x);});
/* read as a data URL (blob URLs are blocked in some hosts), then scale down large camera photos */
const fileToImg=file=>new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;
  r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const max=2000,sc=Math.min(1,max/Math.max(i.width,i.height));
    if(sc===1)return res(i);const c=document.createElement("canvas");c.width=Math.round(i.width*sc);c.height=Math.round(i.height*sc);
    c.getContext("2d").drawImage(i,0,0,c.width,c.height);const o=new Image();o.onload=()=>res(o);o.onerror=rej;o.src=c.toDataURL("image/jpeg",0.92);};i.src=r.result;};
  r.readAsDataURL(file);});
function scanMsg(msg,o={}){S.scan={...(S.scan||{}),msg,...o};render();}
async function readBarcode(img){

  await loadScript(LIBS.zxing);const R=new ZXing.BrowserMultiFormatReader();

const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
/* digits misread as letters by OCR, used only next to a known label */
const digitsOnly=v=>v.toUpperCase().replace(/[OQD]/g,"0").replace(/[IL|]/g,"1").replace(/S/g,"5").replace(/B/g,"8").replace(/Z/g,"2").replace(/[^0-9]/g,"");
function findDates(t){
  const out=[],ok=d=>/^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(d)&&d>"1900"&&d<=today(),p=n=>String(n).padStart(2,"0");

  for(const m of t.matchAll(/(\d{1,2})\s*[-\/ ]?\s*([A-Za-z]{3,9})\.?\s*[-\/ ,]?\s*(\d{4})/g)){const mo=MONTHS[m[2].slice(0,3).toLowerCase()];if(mo)out.push(`${m[3]}-${p(mo)}-${p(m[1])}`);}
  for(const m of t.matchAll(/([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/g)){const mo=MONTHS[m[1].slice(0,3).toLowerCase()];if(mo)out.push(`${m[3]}-${p(mo)}-${p(m[2])}`);}
  return out.filter(ok);
}
function parseSticker(text,nameText){
  text=toEn(text);if(nameText)nameText=toEn(nameText);
  const t=text.replace(/[|]/g," "),out={},bad=[],lines=t.split(/\n/).map(x=>x.trim()).filter(Boolean);
  const after=(re)=>{const l=lines.find(x=>re.test(x));return l?l.replace(new RegExp(".*?"+re.source+"\\s*[:#.\\-]?\\s*","i"),"").trim():"";};
  /* label first, then pattern */
  const mrnL=after(/\b(mr[nm]|m\.r\.n|file\s*(no|number)|medical\s*record(\s*(no|number))?)/i);
  if(mrnL){const raw=mrnL.split(/\s{2,}|\s(?=[A-Za-z]{3})|\s*[,;]\s*/)[0],v=digitsOnly(raw);if(/^6\d{6}$/.test(v))out.mrn=v;else if(raw&&!raw.includes(UNSURE))bad.push(`MRN "${raw}"`);}
  if(!out.mrn){const m=t.match(/(?<!\d)6\d{6}(?!\d)/);if(m)out.mrn=m[0];}
  const idL=after(/\b(id|national\s*id|iqama)\s*(no\.?|number|#)?/i);
  if(idL){const raw=idL.split(/\s{2,}|\s(?=[A-Za-z]{3})|\s*[,;]\s*/)[0],v=digitsOnly(raw);if(/^\d{10}$/.test(v))out.idNo=v;else if(raw&&!raw.includes(UNSURE))bad.push(`ID "${raw}"`);}
  if(!out.idNo){const m=t.match(/(?<!\d)[12]\d{9}(?!\d)/);if(m)out.idNo=m[0];}

  const admL=after(/(admission\s*date|adm(\.|ission)?\s*date|date\s*of\s*admission|admitted)/i);
  if(admL){const a=findDates(admL);if(a.length)out.admitDate=a[0];}

  const nl=nlines.find(x=>/\b(patient\s*name|name)\b/i.test(x));
  let nm=nl?nl.replace(/.*?\b(patient\s*name|name)\b\s*[:#.\-]?\s*/i,"").trim():"";
  if(!nm)nm=nlines.find(l=>/^[A-Za-z][A-Za-z' .-]{5,}$/.test(l)&&l.split(/\s+/).length>=2&&!/(hospital|record|mrn|dob|date|ward|room|bed|doctor|dr\b|test|sample)/i.test(l))||"";

  if(nm.includes(UNSURE))nm="";
  nm=nm.replace(/[^A-Za-z\u0600-\u06FF' .-]/g," ").replace(/\s+/g," ").trim();
  if(nm===nm.toLowerCase()||nm===nm.toUpperCase())nm=nm.toLowerCase().replace(/(^|[\s'-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
  if(nm.length>=4&&nm.split(" ").length>=2)out.name=nm;
  const sx=after(/\b(sex|gender)\b/i);if(/^f/i.test(sx))out.sex="Female";else if(/^m/i.test(sx))out.sex="Male";
  if(bad.length)out._bad=bad;
  return out;
}

  const d=x.getImageData(0,0,c.width,c.height),p=d.data;let lo=255,hi=0;const g=new Uint8ClampedArray(p.length/4);
  for(let i=0,j=0;i<p.length;i+=4,j++){const v=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];g[j]=v;if(v<lo)lo=v;if(v>hi)hi=v;}
  const r=hi-lo||1;for(let i=0,j=0;i<p.length;i+=4,j++){const v=(g[j]-lo)*255/r;p[i]=p[i+1]=p[i+2]=v;}
  x.putImageData(d,0,0);return c;

async function handleScan(kind,file){

    if(kind==="barcode"){const codes=await readBarcode(img);const c=codes.map(x=>x.match(/6\d{6}/)?.[0]).find(Boolean);
      if(!c)return scanMsg(codes.length?`Barcode read (${codes[0]}) but it does not contain a 7-digit MRN starting with 6.`:"No barcode found. Hold the camera closer and keep the barcode flat and sharp.",{bad:true,busy:false});

      const read=async src=>{const r=await Tesseract.recognize(src,"eng");const st=sureText(r.data);return{st,raw:r.data.text,found:parseSticker(st.text,sureText(r.data,OCR_NAME_MIN).text)};};

      if(Object.keys(best.found).filter(k=>k!=="_bad").length<3){scanMsg("Reading again from the original photo…",{busy:true,bad:false});const b2=await read(img);
        if(Object.keys(b2.found).filter(k=>k!=="_bad").length>Object.keys(best.found).filter(k=>k!=="_bad").length)best=b2;}

      if(found.dob&&fair.some(w=>findDates(w).includes(found.dob)))chk.push("date of birth");
      if(found.admitDate&&fair.some(w=>findDates(w).includes(found.admitDate)))chk.push("admission date");
      S.scan={...(S.scan||{}),raw:best.raw,weak:best.st.weak,chk};
      if(!Object.keys(found).length&&best.st.dropped)return scanMsg("Parts of the photo were read with low certainty, so nothing was filled. Open \"What the reader saw\" below to check, then retake the photo straight on and in good light, or type the details.",{bad:true,busy:false});

    scanMsg(`Filled: ${Object.keys(found).filter(k=>names[k]&&k!=="idType"&&k!=="name").map(k=>names[k]).join(", ")}. Check each field before saving.${S.scan?.chk?.length?` Read with less certainty, check carefully: ${S.scan.chk.join(", ")}.`:""}${S.scan?.weak?.length?` Left out because they were unclear: ${S.scan.weak.join(", ")}.`:""}${bad.length?` Not filled: ${bad.join(" and ")} does not match the hospital format (MRN 7 digits starting with 6, ID 10 digits).`:""}`,{busy:false,bad:false,filled:Object.keys(found)});
  }catch(e){scanMsg("The reader could not load. It needs an internet connection the first time; otherwise type the details.",{bad:true,busy:false});}
}

const vaeNum=v=>v===""||v==null?null:+String(v).replace(/,/g,"");
const vFiO2=v=>{const n=vaeNum(v);return n==null?null:n<=1?Math.round(n*100):n;};

function vaeBlock(f){

/* VAC: after 2 or more days of stable or falling daily minimum PEEP or FiO2, a rise of 3 cmH2O PEEP or 20 FiO2 points over the first baseline day, held 2 days.
   IVAC: plus temp > 38 or < 36, or WBC >= 12,000 or <= 4,000, and a new antimicrobial continued 4 or more days, within 2 days of the onset.
   PVAP: IVAC plus a respiratory specimen with an organism in the same window. Screening only. */
function vaeScan(d){
  const rows=d.checks.filter(c=>c.vae).slice().sort((a,b)=>a.date.localeCompare(b.date)),out=[];
  const P=c=>{const v=vaeNum(c.vae.peep);return v==null?null:Math.max(5,v);},F=c=>vFiO2(c.vae.fio2);
  for(let i=2;i+1<rows.length;i++){
    const b1=rows[i-2],b2=rows[i-1],e1=rows[i],e2=rows[i+1];
    if(dayDiff(b1.date,b2.date)!==1||dayDiff(b2.date,e1.date)!==1||dayDiff(e1.date,e2.date)!==1)continue;
    const test=(g,rise)=>{const a=g(b1),b=g(b2),x=g(e1),y=g(e2);if([a,b,x,y].some(v=>v==null))return false;if(b>a)return false;return x>=a+rise&&y>=a+rise;};
    if(test(P,3)||test(F,20)){
      const win=rows.filter(c=>Math.abs(dayDiff(e1.date,c.date))<=2);
      const inf=win.some(c=>tempBad(c.vae.temp)||wbcBad(c.vae.wbc));
      const abxDays=rows.filter(c=>dayDiff(e1.date,c.date)>=-2&&(c.vae.abx||"").trim());
      let run=0,best=0,prev=null;abxDays.forEach(c=>{run=prev&&dayDiff(prev,c.date)===1?run+1:1;best=Math.max(best,run);prev=c.date;});
      const ivac=inf&&best>=4,pvap=ivac&&win.some(c=>c.vae.spec&&(c.vae.org||"").trim());
      out.push({date:e1.date,type:pvap?"PVAP":ivac?"IVAC":"VAC"});i+=1;}
  }
  return out;
}

async function dischargePt(){
  const p=ptOf(S.pid),f=S.form,d=f.date,last=(p.bedHistory||[]).at(-1)?.until||p.admitDate;
  if(!f.outcome)return fail("Select how the patient left the unit.");

  const transfer=f.outcome==="Transferred to another ward";
  if(transfer){
    if(!f.toUnit)return fail("Select the receiving ward.");
    if(f.toUnit==="Other"&&!f.toUnitOther.trim())return fail("Name the receiving ward.");
    if(BUNDLE_UNITS.includes(f.toUnit)){
      if(!f.bed.trim())return fail("Enter the bed number in the receiving unit.");
      if(d<last)return fail("The transfer date is earlier than the patient's last bed move.");
      const clash=S.patients.find(x=>x.status==="active"&&x.id!==p.id&&x.unit===f.toUnit&&String(x.bed).trim()===f.bed.trim());
      if(clash)return fail(`Bed ${f.bed} in ${f.toUnit} is already taken by ${clash.name}.`);
      (p.bedHistory=p.bedHistory||[]).push({unit:p.unit,bed:p.bed,until:d});
      (p.transfers=p.transfers||[]).push({date:d,from:p.unit,to:f.toUnit,note:f.note});
      p.unit=f.toUnit;p.bed=f.bed.trim();S.round.unit=p.unit;

  if(transfer)(p.transfers=p.transfers||[]).push({date:d,from:p.unit,to,note:f.note});
  Object.assign(p,{status:"discharged",discharged:d,outcome:f.outcome,toUnit:to,dischargeNote:f.note});
  activeDevs(p.id).forEach(x=>{x.removed=d<x.insertDate?x.insertDate:d;if(transfer)x.endReason="Left the round with the patient";});
  await persistB();go("round");toast(f.outcome==="Death"?"Death recorded":"Patient discharged");
}

function matchOpt(v,opts){if(v===undefined||v===null)return undefined;const s=String(v).trim().toLowerCase();return opts.find(o=>String(o).toLowerCase()===s);}
function fixRoom(dept,locType,v){
  const L=LOC[dept];if(!L||!v)return null;const s=String(v).trim();
  if(locType!=="Area"&&Array.isArray(L.rooms)){for(const c of [s,`Bed ${s}`,`Room ${s}`,s.replace(/^(bed|room)\s*/i,"")]){const m=matchOpt(c,L.rooms);if(m)return{locType:"Patient room",room:m};}}
  if(locType!=="Area"&&L.rooms==="text"&&/\d/.test(s))return{locType:"Patient room",room:s.replace(/^(bed|room)\s*/i,"")};
  const a=matchOpt(s,L.areas||[]);if(a)return{locType:"Area",room:a};
  if(locType==="Area"&&(L.areas||[]).length)return{locType:"Area",room:"Other area",areaOther:s};
  return null;
}
function fixBed(unit,v){const l=BEDS[unit]||[];if(!v)return null;const s=String(v).trim().replace(/^bed\s*/i,"");return matchOpt(s,l)||null;}
function aiApply(spec,set){
  set=enDeep(set);

  const lab=k=>spec.fields.find(x=>x.k===k)?.l.split(/[,(]/)[0]||k;
  const order=["dept","unit","outcome","toUnit","locType"];
  const keys=[...order.filter(k=>k in set),...Object.keys(set).filter(k=>!order.includes(k))];
  for(const k of keys){
    const fd=spec.fields.find(x=>x.k===k),v=set[k];if(!fd)continue;
    if(k==="room"){const L=fixRoom(f.dept,set.locType||f.locType,v);if(L){Object.assign(f,{areaOther:"",...L});if(S.view==="env")f.st={};done.push(`Location: ${L.areaOther||L.room}`);}else miss.push(`room "${v}"`);continue;}
    if(k==="bed"){const u=S.view==="dischg"?f.toUnit:f.unit,b=fixBed(u,v);if(b){f.bed=b;done.push(`Bed: ${b}`);}else miss.push(`bed "${v}"`);continue;}
    if(fd.t==="enum"){const m=matchOpt(v,fd.o);if(m===undefined){miss.push(`${lab(k)} "${v}"`);continue;}
      if(k==="dept"&&f.dept!==m)Object.assign(f,{room:"",areaOther:"",locType:"",specialty:"",specialtyOther:""});
      if((k==="unit"||k==="toUnit")&&f[k]!==m)f.bed="";
      f[k]=m;if(k==="action"&&m!=="missed")f.gloves="";done.push(`${lab(k)}: ${k==="action"?HH_ACTIONS.find(a=>a.k===m).l:m}`);}
    else if(fd.t==="multi"){const l=(Array.isArray(v)?v:[v]).map(x=>matchOpt(x,fd.o)).filter(x=>x!==undefined);if(l.length){f[k]=[...new Set(l)].sort();done.push(`${lab(k)}: ${f[k].join(", ")}`);}}
    else if(fd.t==="date"){if(/^\d{4}-\d{2}-\d{2}$/.test(v)&&v<=today()){f[k]=v;done.push(`${lab(k)}: ${fmt(v)}`);}else miss.push(`${lab(k)} "${v}"`);}
    else if(typeof v==="string"&&v.trim()){const v2=toEn(v);f[k]=k==="note"&&f.note&&!f.note.includes(v2)?`${f.note} ${v2}`.trim():v2.trim();done.push(`${lab(k)}: ${f[k]}`);continue;}
    else if(typeof v==="string"&&v.trim()){f[k]=k==="note"&&f.note&&!f.note.includes(v)?`${f.note} ${v}`.trim():v.trim();done.push(`${lab(k)}: ${f[k]}`);}
  }
  if(spec.items&&set.items){f.items=f.items||{};f.subs=f.subs||{};
    spec.items.forEach((it,n)=>{const v=set.items[it.k];if(!["y","n","na"].includes(v))return;f.items[it.k]=v;
      if(v==="n"&&it.subs){const r=(set.subs?.[it.k]||[]).map(x=>matchOpt(x,it.subs)).filter(Boolean);if(r.length)f.subs[it.k]=[...new Set(r)];}
      else delete f.subs[it.k];
      done.push(`${n+1}. ${it.t}: ${({y:"Yes",n:"No",na:"N/A"})[v]}${f.subs[it.k]?.length?` (${f.subs[it.k].join(", ")})`:""}`);});}
  if(spec.env){
    const prof=envProfile(f),envSet=set.env||{};

    for(const [r,marks] of Object.entries(envSet)){if(!ENV_RESP[r])continue;

      for(const [k,v] of Object.entries(marks||{})){const it=list.find(i=>i.k===k);if(!it){const g=envAll().find(i=>i.k===k);miss.push(`${g?.t||k} is not on the ${r.toLowerCase()} checklist here`);continue;}

      if(!Object.keys(marks||{}).length)done.push(`Responsibility: ${r}`);}
  }
  return{done,miss};
}

    if(!p)return `No active patient found in ${j.unit||"that unit"} bed ${j.bed||"?"}.`;
    if(!deptOk(p.unit))return "You do not have access to that unit.";
    S.pid=p.id;const task=j.task||"open",fake=ds=>({dataset:ds});
    if(task==="open"){go("patient",{pid:p.id});return null;}
    if(task==="culture"){handleBundle("newcult",fake({}));return null;}

    if(task==="surgery"){handleBundle("newsurg",fake({}));return null;}

    if(!d)return `No active ${j.device?DEV[j.device].name.toLowerCase():"device"} on bed ${p.bed}.`;

}
async function aiSend(text){

/* dates always shown in English digits as DD/MM/YYYY, whatever the phone's language */
const toDMY=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||"")?`${v.slice(8)}/${v.slice(5,7)}/${v.slice(0,4)}`:"";
const ARD="٠١٢٣٤٥٦٧٨٩";
const TOUCH=matchMedia("(pointer:coarse)").matches||"ontouchstart" in window;
/* read a date box by id: the stored value is always YYYY-MM-DD, whatever is shown */
const dv=id=>{const n=$("#"+id+"-native");if(n)return n.value;const e=$("#"+id);return e?(fromDMY(e.value)||e.value):"";};
function fromDMY(t){t=(t||"").replace(/[٠-٩]/g,d=>ARD.indexOf(d)).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(t))t=`${t.slice(8)}/${t.slice(5,7)}/${t.slice(0,4)}`;const m=t.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{4})$/);if(!m)return null;
  const v=`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`,d=new Date(v+"T00:00:00Z");return !isNaN(d)&&d.toISOString().slice(0,10)===v?v:null;}

function sigBlock(key,label,f,need){f.sig=f.sig||{};const v=f.sig[key]||{};

    <label class="f" for="sgn-${key}">Name</label><input type="text" id="sgn-${key}" data-sig="${key}" value="${esc(v.name||"")}" autocapitalize="words">
    <label class="f">Signature <small>(sign with your finger or mouse)</small></label>
    <div class="sigpad"><canvas data-sigc="${key}" width="600" height="170" aria-label="Signature box for ${esc(label)}"></canvas>
      <button type="button" class="btn ghost small" data-a="sigclear" data-k="${key}">Clear</button></div></div>`;}
const sigShow=(x,label)=>x?.img||x?.name?`<div class="sigshow"><small>${esc(label)}</small><b>${esc(x.name||"")}</b>${x.img?`<img src="${x.img}" alt="Signature of ${esc(x.name||label)}">`:`<i class="hint">no signature</i>`}${x.date?`<small>${fmt(x.date)}</small>`:""}</div>`:"";
function enhanceSigs(){
  document.querySelectorAll("#app canvas[data-sigc]:not([data-on])").forEach(c=>{
    c.dataset.on="1";const key=c.dataset.sigc,ctx=c.getContext("2d");ctx.lineWidth=3.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#14304A";
    const cur=S.form?.sig?.[key]?.img;if(cur){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=cur;}
    let draw=false,last=null,drew=false;
    const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
    c.addEventListener("pointerdown",e=>{e.preventDefault();draw=true;last=pt(e);c.setPointerCapture(e.pointerId);});
    c.addEventListener("pointermove",e=>{if(!draw)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();last=p;drew=true;});
    const end=()=>{if(!draw)return;draw=false;if(!drew)return;
      const o=document.createElement("canvas");o.width=300;o.height=85;const ox=o.getContext("2d");ox.fillStyle="#fff";ox.fillRect(0,0,300,85);ox.drawImage(c,0,0,300,85);
      S.form.sig=S.form.sig||{};S.form.sig[key]={...(S.form.sig[key]||{}),img:o.toDataURL("image/jpeg",.7)};};
    c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);c.addEventListener("pointerleave",end);
  });
}

function enhanceDates(){
  document.querySelectorAll('#app input[type=date]:not([data-enh])').forEach(inp=>{
    inp.dataset.enh="1";const box=document.createElement("div");box.className="dbox";
    const t=document.createElement("input");t.type="text";t.inputMode="numeric";t.placeholder="DD/MM/YYYY";t.autocomplete="off";t.dir="ltr";
    t.className="dtext "+(inp.className||"");t.value=toDMY(inp.value);if(inp.id){t.id=inp.id;inp.id=inp.id+"-native";}
    const b=document.createElement("button");b.type="button";b.className="dcal";b.setAttribute("aria-label","Open calendar");
    b.innerHTML='<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3h1V3a1 1 0 0 1 1-1Zm13 8H4v9a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-9ZM8 13h3v3H8v-3Z"/></svg>';
    inp.classList.add("dnative");inp.tabIndex=-1;inp.setAttribute("aria-label","Open calendar");
    inp.parentNode.insertBefore(box,inp);box.append(t,b,inp);
    const push=v=>{inp.value=v;inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}));};
    /* the real date box sits on top of the calendar button, so a tap opens the phone's own date wheel; desktops get showPicker */
    inp.addEventListener("click",e=>{e.stopPropagation();if(!TOUCH){try{inp.showPicker();}catch(_){}}});
    b.addEventListener("click",e=>{e.stopPropagation();try{inp.showPicker();}catch(_){inp.focus();}});
    /* typing: digits only, the slashes are added automatically (phone number pads have no "/") */
    t.addEventListener("input",()=>{const raw=t.value.replace(/[٠-٩]/g,d=>ARD.indexOf(d));
      if(!/^[\d\/]+$/.test(raw)||[...raw].some((ch,i)=>ch==="/"&&i!==2&&i!==5))return;
      const dg=raw.replace(/\D/g,"").slice(0,8);
      const nv=dg.length>4?`${dg.slice(0,2)}/${dg.slice(2,4)}/${dg.slice(4)}`:dg.length>2?`${dg.slice(0,2)}/${dg.slice(2)}`:dg;
      if(t.value!==nv){t.value=nv;try{t.setSelectionRange(nv.length,nv.length);}catch(_){}}
      if(dg.length===8)t.dispatchEvent(new Event("change"));});
    inp.addEventListener("change",()=>{t.value=toDMY(inp.value);t.classList.remove("badd");});
    t.addEventListener("change",()=>{if(!t.value.trim()){push("");return;}const v=fromDMY(t.value);
      if(!v||(inp.max&&v>inp.max)||(inp.min&&v<inp.min)){t.classList.add("badd");toast(v?"That date is outside the allowed range":"Write the date as DD/MM/YYYY",true);return;}
      t.classList.remove("badd");if(v!==inp.value)push(v);else t.value=toDMY(v);});
  });
}

const val=id=>($("#"+id)?.value||"").trim();
function fail(msg){S.error=msg;render();}
async function doSetup(){
  const name=val("sn"),username=val("su").toLowerCase(),p=$("#sp").value,p2=$("#sp2").value;
  if(!name||!username)return fail("Enter your full name and a username.");
  if(p.length<6)return fail("Use a password of at least 6 characters.");
  if(p!==p2)return fail("The two passwords do not match.");
  const salt=newSalt();S.users=[{name,username,role:"team",salt,hash:await hashPw(p,salt)}];
  await sset("ipc-users",S.users);S.user=sessUser(S.users[0]);await sset("ipc-session",username);go("home");
}
async function doLogin(){
  const username=val("lu").toLowerCase(),p=$("#lp").value,u=S.users.find(x=>x.username===username);S.loginId=username;
  if(!S.users.length)return fail("No accounts exist yet. Use Create account below.");
  if(!u||await hashPw(p,u.salt)!==u.hash)return fail("Username or password is incorrect.");
  S.user=sessUser(u);await sset("ipc-session",u.username);go("home");autoActions();
  setTimeout(()=>{if(backupOverdue())toast(backupDays()===null?"Reminder: take your first backup from Data and settings":`Reminder: last backup was ${backupDays()} days ago`,true);},1400);
}
async function addUser(){
  const name=val("nn"),username=val("nu").toLowerCase(),role=$("#nr").value,p=$("#np").value;
  if(!name||!username)return fail("Enter the full name and a username.");
  if(!/^[a-z0-9._-]{3,}$/.test(username))return fail("Usernames use 3 or more letters, numbers, dots, dashes or underscores, with no spaces.");
  if(S.users.some(u=>u.username===username))return fail("That username is already taken.");
  if(p.length<6)return fail("Use a temporary password of at least 6 characters.");

function validate(t,f){
  if(!f.dept)return "Select a department.";
  if(f.dept==="Other"&&!f.deptOther.trim())return "Name the department.";
  if(f.dept==="General OPD"&&!f.specialty)return "Select the clinic specialty.";
  if(f.specialty==="Other specialty"&&!f.specialtyOther.trim())return "Name the specialty.";
  if(t==="hh"){
    if(f.dept==="Isolation rooms"&&!f.isoUnit)return "Select which isolation: ER, ICU, CCU or third floor.";
    if(!f.category)return "Select the staff category.";
    if(!f.moments.length)return "Select the moment observed.";
    if(!f.action)return "Select the hand hygiene action.";
    if(f.action==="missed"&&!f.gloves)return "Say whether the staff member was wearing gloves.";
    return "";
  }
  if(!f.locType)return "Choose patient room or area.";
  if(!f.room.trim())return f.locType==="Area"?"Select the area.":"Select or enter the room.";
  if(f.room==="Other area"&&!f.areaOther.trim())return "Name the area.";
  if(t==="ppe"&&!f.precautions.length)return "Select the precautions on the door.";
  if(t==="ppe"&&!f.category)return "Select the staff category.";
  if(t==="env"&&!f.cleanType)return "Select the cleaning type.";
  if(t==="env"&&!f.method)return "Select the method of checking.";
  if(t==="env"&&!f.seen.length)return "Choose housekeeping or healthcare provider.";
  if(t==="env")return "";
  const miss=CHECK[t].findIndex(i=>!f.items[i.k]);
  if(miss>-1)return `Answer item ${miss+1} of the checklist.`;
  const sm=subMiss(CHECK[t],f);
  if(sm>-1)return `Item ${sm+1}: select what was wrong.`;
  return "";
}
async function save(){
  const t=S.module,f=S.form,e=validate(t,f);if(e)return fail(e);
  if(t==="env")return saveEnv();
  const compliant=t==="hh"?f.action!=="missed":!Object.values(f.items).includes("n");
  const id=uid(),{photos,...data}=f,ph=photos||[];
  for(let i=0;i<ph.length;i++)await sset(`ipc-photo:${id}:${i}`,ph[i]);
  const rec={...JSON.parse(JSON.stringify(data)),id,ts:Date.now(),type:t,compliant,auditor:S.user.name,auditorUser:S.user.username,photoCount:ph.length};
  S.audits.push(rec);await sset("ipc-audits",S.audits);
  if(t==="hh"){S.session.n++;if(compliant)S.session.ok++;}
  S.form=freshForm(t,t==="hh"?f:{validation:f.validation,dept:f.dept,deptOther:f.deptOther,specialty:f.specialty,specialtyOther:f.specialtyOther,locType:f.locType,cleanType:f.cleanType,method:f.method,resp:f.resp});
  S.error="";render();toast(isTeam()?(compliant?"Saved: compliant":"Saved: not compliant"):"Saved",isTeam()&&!compliant);
}
async function saveEnv(){
  const f=S.form,prof=envProfile(f),tracks=[];
  for(const r of f.seen){const l=envList(prof,r);
    if(!l.length)return fail(`${r}: add at least one item to the checklist for this location, or leave it out.`);
    const items=Object.fromEntries(l.map(i=>[i.k,f.st[i.k]||"y"]));
    if(!Object.values(items).some(v=>v!=="na"))return fail(`${r}: every item is marked not available. Mark at least one clean or not clean, or leave it out.`);
    tracks.push({resp:r,items});}
  const {photos,st,seen,...data}=f,ph=photos||[],visit=uid();let first=null,bad=0;
  for(const tr of tracks){const id=uid()+tr.resp.slice(0,1);
    if(!first){first=id;for(let i=0;i<ph.length;i++)await sset(`ipc-photo:${id}:${i}`,ph[i]);}
    const compliant=!Object.values(tr.items).includes("n");if(!compliant)bad++;
    S.audits.push({...JSON.parse(JSON.stringify(data)),resp:tr.resp,items:tr.items,profile:prof,visit,id,ts:Date.now(),type:"env",compliant,
      auditor:S.user.name,auditorUser:S.user.username,photoCount:ph.length,...(id!==first&&ph.length?{photoRef:first}:{})});}
  await sset("ipc-audits",S.audits);
  S.form=freshForm("env",{dept:f.dept,deptOther:f.deptOther,specialty:f.specialty,specialtyOther:f.specialtyOther,locType:f.locType,cleanType:f.cleanType,method:f.method});
  S.error="";render();
  toast(tracks.length>1?`Saved ${tracks.length} entries${isTeam()?`: ${bad?`${bad} not compliant`:"both compliant"}`:""}`:isTeam()?(bad?"Saved: not compliant":"Saved: compliant"):"Saved",isTeam()&&bad>0);
}
async function loadPhotos(a){

}

function resizeImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const max=1280,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.7));};
      img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

function csv(){
  const head=["Date","Audit","Department","Location","Staff category","Staff ID","Precautions","Cleaning type","Method","Responsibility","Moments","Action","Gloves","Checklist","Result","Feedback given","Photos","Auditor","Note"];
  const ans={y:"Yes",n:"No",na:"N/A"},envAns={y:"Clean",n:"Not clean",na:"N/A"};
  const rows=S.audits.map(a=>{
    const items=a.type==="hh"?"":CHECK[a.type].filter(i=>a.items[i.k]).map(i=>`${withWhy(i,a)}: ${(a.type==="env"?envAns:ans)[a.items[i.k]]}`).join(" | ");
    return[a.date,MODULES[a.type].name,deptName(a),locName(a),a.category?catName(a):"",a.staffId||"",precName(a),a.cleanType||"",a.method||"",a.resp||"",(a.moments||[]).join("+"),a.action||"",a.gloves||"",items,a.compliant?"Compliant":"Not compliant",a.feedback||"",photoCount(a),a.auditor,a.note||""];
  });
  const text="\uFEFF"+[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");

}

function parseCSV(t){const rows=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];

  else if(ch==='"')q=true;else if(ch===","||ch===";"||ch==="\t"){r.push(c);c="";}else if(ch==="\n"){r.push(c);rows.push(r);r=[];c="";}else if(ch!=="\r")c+=ch;}
  if(c||r.length){r.push(c);rows.push(r);}return rows.filter(x=>x.some(v=>String(v).trim()));}

  S.imp={name:file.name,headers,data,map};go("mdroimp");
}

function devMetrics(pS,pE,unit){
  const inU=u=>unit==="all"||u===unit,inP=x=>x>=pS&&x<pE,uAt=(pid,d,r)=>{const p=ptOf(pid);return p?unitAt(p,d,r):null;};
  const ptDays=S.patients.reduce((t,p)=>t+segs(p).filter(g=>inU(g.unit)).reduce((x,g)=>x+overlap(g.s,g.e,pS,pE),0),0);
  const devDays=d=>{const p=ptOf(d.patientId);if(!p)return 0;const end=d.removed||pE;return segs(p).filter(g=>inU(g.unit)).reduce((x,g)=>x+overlap(d.insertDate>g.s?d.insertDate:g.s,end<g.e?end:g.e,pS,pE),0);};
  const rows=Object.entries(DEV).map(([k,m])=>{const ds=S.devices.filter(d=>d.type===k),dd=ds.reduce((x,d)=>x+devDays(d),0);
    const ch=ds.flatMap(d=>d.checks.filter(c=>inP(c.date)&&inU(uAt(d.patientId,c.date))));
    const ev=S.events.filter(e=>e.status==="Confirmed HAI"&&inP(e.date)&&inU(uAt(e.patientId,e.date,true))).filter(e=>{const a=assess(e);return a.type===k&&a.kind==="flag";});
    return{k,m,dd,ch:ch.length,chOk:ch.filter(checkOk).length,hai:ev.length,rate:dd?ev.length/dd*1000:null,du:ptDays?dd/ptDays:null};});
  const ops=S.surg.filter(x=>inP(x.date)&&inU(uAt(x.patientId,x.date))),ids=new Set(ops.map(x=>x.id));
  const ssi=S.events.filter(e=>e.status==="Confirmed HAI").filter(e=>{const a=assess(e);return a.type==="ssi"&&a.kind==="flag"&&ids.has(a.procId);}).length;
  return{ptDays,rows,ops:ops.length,opsOk:ops.filter(surgOk).length,ssi};
}

/* ================= 1. Annual IPC risk assessment ================= */
/* Score = probability (1-4) x impact (1-4) x preparedness gap (1 good, 2 fair, 3 poor). 24 and above is a high priority. */
const RISK_TEMPLATE=[
  ["Device-associated infection","CLABSI"],["Device-associated infection","CAUTI"],["Device-associated infection","Ventilator-associated events"],
  ["Procedure-associated infection","Surgical site infection"],["Transmission","MRSA transmission"],["Transmission","Carbapenem-resistant organisms (CRE, CRAB, CRPA)"],
  ["Transmission","Clostridioides difficile"],["Transmission","Candida auris"],["Practice","Hand hygiene compliance"],["Practice","PPE and isolation compliance"],
  ["Environment","Environmental cleaning"],["Environment","Construction and renovation (ICRA)"],["Environment","Water safety and Legionella"],
  ["Reprocessing","Sterilization or high-level disinfection failure"],["Reprocessing","Endoscope reprocessing"],
  ["Respiratory and emerging","Tuberculosis exposure"],["Respiratory and emerging","Influenza and respiratory virus outbreaks"],["Respiratory and emerging","MERS-CoV"],
  ["Respiratory and emerging","Mass gatherings (Hajj and Umrah seasons)"],["Respiratory and emerging","Measles and varicella exposure"],
  ["Staff safety","Needlestick and sharps injuries"],["Staff safety","Staff immunization gaps"],["Staff safety","N95 fit testing coverage"],["Waste","Medical waste handling"]];
const riskScore=x=>(+x.prob||0)*(+x.impact||0)*(+x.prep||0);
const riskLevel=sc=>sc>=24?["High","no"]:sc>=12?["Medium","mid"]:sc>0?["Low","ok"]:["Not scored","mid"];
function riskEvidence(h){
  const y=thisYear(),aud=k=>{const l=S.audits.filter(a=>a.type===k&&a.date.startsWith(y));return l.length?`${pctN(l.filter(a=>a.compliant).length,l.length)}% compliant this year (n=${l.length})`:"";};
  const dm=devMetrics(y+"-01-01",addDays(today(),1),"all"),r=k=>{const x=dm.rows.find(z=>z.k===k);return x&&x.dd?`${x.hai} confirmed, ${x.rate.toFixed(2)} per 1,000 device days this year`:"";};
  const m=t=>{const n=S.mdro.filter(x=>x.date?.startsWith(y)&&(Array.isArray(t)?t.includes(x.mdroType):x.mdroType===t)).length;return n?`${n} cases this year`:"";};
  return({"CLABSI":r("cl"),"CAUTI":r("uc"),"Ventilator-associated events":r("mv"),"Surgical site infection":dm.ops?`${dm.ssi} SSI in ${dm.ops} operations this year`:"",
    "MRSA transmission":m("MRSA"),"Carbapenem-resistant organisms (CRE, CRAB, CRPA)":m(["CRE","CRAB","CRPA"]),"Clostridioides difficile":m("C. difficile"),"Candida auris":m("Candida auris"),
    "Hand hygiene compliance":aud("hh"),"PPE and isolation compliance":aud("ppe"),"Environmental cleaning":aud("env"),"Medical waste handling":aud("waste"),
    "Needlestick and sharps injuries":(()=>{const n=S.expo.filter(x=>x.date.startsWith(y)).length;return n?`${n} exposures this year`:"";})(),
    "N95 fit testing coverage":(()=>{const n=S.fit.filter(x=>x.result==="Pass"&&addDays(x.date,365)>=today()).length;return n?`${n} staff with a valid fit test`:"";})()})[h]||"";
}

}

/* ================= 3. Statistical process control ================= */
/* u-chart for infection rates (per 1,000 device or patient days), p-chart for compliance. Signals: a point outside the 3-sigma limits, or 8 in a row on one side of the centre line. */
function spcSeries(kind,key,unit){
  const ms=monthsBack(12),pts=[];
  for(const m of ms){const pS=m+"-01",pE=monthEnd(m);
    if(kind==="p"){const l=S.audits.filter(a=>a.type===key&&monthKey(a.date)===m&&(unit==="all"||deptName(a)===unit));pts.push({m,x:l.filter(a=>a.compliant).length,n:l.length});}
    else if(key==="mdro"){const s2=mdroStats(unit,m);pts.push({m,x:s2.ho,n:s2.pd/1000});}
    else{const r=devMetrics(pS,pE,unit).rows.find(z=>z.k===key);pts.push({m,x:r.hai,n:r.dd/1000});}}
  const N=pts.reduce((t,p)=>t+p.n,0),X=pts.reduce((t,p)=>t+p.x,0),c=N?X/N:0;
  pts.forEach(p=>{if(!p.n){p.v=null;return;}p.v=p.x/p.n;const sd=kind==="p"?Math.sqrt(c*(1-c)/p.n):Math.sqrt(c/p.n);p.ucl=kind==="p"?Math.min(1,c+3*sd):c+3*sd;p.lcl=Math.max(0,c-3*sd);
    p.out=p.v>p.ucl||p.v<p.lcl;});
  let run=0,side=0;pts.forEach(p=>{if(p.v===null){run=0;return;}const sd2=p.v>c?1:p.v<c?-1:0;if(sd2&&sd2===side)run++;else{run=sd2?1:0;side=sd2;}p.shift=run>=8;});
  return{pts,c,kind,scale:kind==="p"?100:1};
}
function spcSVG(sr,title,unitLabel){
  const W=680,H=250,L=48,R=12,T=24,B=40,pts=sr.pts,sc=sr.scale,vals=pts.flatMap(p=>p.v===null?[]:[p.v,p.ucl]).map(v=>v*sc);
  const max=Math.max(1,...vals,sr.c*sc)*1.1,x=i=>L+(W-L-R)*(i+.5)/pts.length,y=v=>T+(H-T-B)*(1-v*sc/max);
  const path=k=>pts.map((p,i)=>p.v===null?"":`${x(i)},${y(p[k])}`).filter(Boolean).join(" ");
  const sig=pts.filter(p=>p.out||p.shift).length;
  return `<figure class="spc"><figcaption><b>${esc(title)}</b> <small>${unitLabel}. Centre ${(sr.c*sc).toFixed(sr.kind==="p"?0:2)}${sr.kind==="p"?"%":""}.
      ${sig?`<span class="tag no">${sig} ${sig===1?"signal":"signals"}</span>`:`<span class="tag ok">In control</span>`}</small></figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} control chart">
      ${[0,.25,.5,.75,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${T+(H-T-B)*f}" y2="${T+(H-T-B)*f}" stroke="#E3ECEC"/><text x="${L-6}" y="${T+(H-T-B)*f+4}" text-anchor="end" font-size="11" fill="#4F6670">${(max*(1-f)).toFixed(sr.kind==="p"?0:1)}</text>`).join("")}
      <polyline points="${path("ucl")}" fill="none" stroke="#B42318" stroke-dasharray="5 4" stroke-width="1.5"/>
      <polyline points="${path("lcl")}" fill="none" stroke="#B42318" stroke-dasharray="5 4" stroke-width="1.5"/>
      <line x1="${L}" x2="${W-R}" y1="${y(sr.c)}" y2="${y(sr.c)}" stroke="#245E68" stroke-width="1.5"/>
      <polyline points="${path("v")}" fill="none" stroke="#2E3E47" stroke-width="2"/>
      ${pts.map((p,i)=>p.v===null?"":`<circle cx="${x(i)}" cy="${y(p.v)}" r="${p.out||p.shift?6:4}" fill="${p.out||p.shift?"#B42318":"#2E3E47"}"><title>${monthName(p.m)}: ${(p.v*sc).toFixed(2)}${p.out?", outside the limits":p.shift?", part of a run of 8":""}</title></circle>`).join("")}
      ${pts.map((p,i)=>`<text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="11" fill="#4F6670">${new Date(p.m+"-01T00:00:00Z").toLocaleString("en",{month:"short",timeZone:"UTC"})}</text>`).join("")}
    </svg></figure>`;
}

  const kind=MODULES[f.m]?"p":"u",units=kind==="p"?["all",...DEPARTMENTS]:["all",...(f.m==="mdro"?INPATIENT:BUNDLE_UNITS)];

    <div class="row" style="align-items:end"><div><label class="f" for="spm">Measure</label><select id="spm" data-spc="m">${opts.map(([v,l])=>`<option value="${v}" ${v===f.m?"selected":""}>${l}</option>`).join("")}</select></div>
      <div><label class="f" for="spu">${kind==="p"?"Department":"Unit"}</label><select id="spu" data-spc="unit">${units.map(u=>`<option value="${u}" ${u===f.unit?"selected":""}>${u==="all"?"All":u}</option>`).join("")}</select></div></div>
    <div class="card" style="margin-top:14px">${spcSVG(sr,lab+(f.unit==="all"?"":`, ${f.unit}`),kind==="p"?"p-chart, percent compliant":"u-chart, per 1,000 "+(f.m==="mdro"?"patient days":"device days"))}</div>
    <div class="scroll" style="margin-top:12px"><table><thead><tr><th>Month</th><th>${kind==="p"?"Compliant":"Cases"}</th><th>${kind==="p"?"Observed":"Days (thousands)"}</th><th>Value</th><th>Limits</th><th>Signal</th></tr></thead><tbody>
      ${sr.pts.map(p=>`<tr><td>${monthName(p.m)}</td><td class="c">${p.x}</td><td class="c">${kind==="p"?p.n:p.n.toFixed(2)}</td><td class="c">${p.v===null?"–":(p.v*sr.scale).toFixed(2)}</td>
        <td class="c">${p.v===null?"–":`${(p.lcl*sr.scale).toFixed(1)} to ${(p.ucl*sr.scale).toFixed(1)}`}</td><td class="c">${p.out?`<span class="tag no">Outside limits</span>`:p.shift?`<span class="tag no">Run of 8</span>`:"–"}</td></tr>`).join("")}</tbody></table></div>
  </div>`;
}

const OB_MEASURES=["Contact precautions for all cases","Cohorting of cases and cohort nursing","Enhanced cleaning and disinfection","Screening of contacts","Hand hygiene audits increased",
  "Staff education session","Admissions restricted to the unit","Dedicated equipment","Antimicrobial review with stewardship","Reported to public health (MOH, HESN)"];
function epiCurve(cases){
  if(!cases.length)return `<p class="hint">No cases yet.</p>`;
  const d0=cases.map(c=>c.date).sort()[0],d1=[...cases.map(c=>c.date),today()].sort().at(-1),days=Math.min(120,dayDiff(d0,d1)+1),W=680,H=200,L=30,B=34,bw=(W-L-10)/days;
  const by={};cases.forEach(c=>{by[c.date]=(by[c.date]||0)+1;});const max=Math.max(...Object.values(by),1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Epidemic curve">${[...Array(days)].map((_,i)=>{const d=addDays(d0,i),n=by[d]||0,h=(H-B-10)*n/max;
    return `${n?`<rect x="${L+i*bw+1}" y="${H-B-h}" width="${Math.max(2,bw-2)}" height="${h}" fill="#B42318"><title>${fmt(d)}: ${n}</title></rect>`:""}${i%Math.ceil(days/8)===0?`<text x="${L+i*bw}" y="${H-B+16}" font-size="10" fill="#4F6670">${fmt(d).replace(/ \d{4}$/,"")}</text>`:""}`;}).join("")}
    <line x1="${L}" x2="${W-10}" y1="${H-B}" y2="${H-B}" stroke="#2E3E47"/><text x="${L-6}" y="16" text-anchor="end" font-size="10" fill="#4F6670">${max}</text></svg>`;
}

const ISO_REASONS=["MRSA","VRE","CRE","CRAB","CRPA","ESBL","C. difficile","Candida auris","Tuberculosis (suspected or confirmed)","Influenza","COVID-19","MERS-CoV (suspected or confirmed)","Varicella or measles","Scabies","Other"];

  ["Contact",["MRSA","VRE","CRE","CRAB","CRPA","ESBL","Candida auris","Scabies"]],
  ["Contact plus",["C. difficile"]],
  ["Droplet",["Influenza","COVID-19"]],
  ["Airborne",["Tuberculosis (suspected or confirmed)","Varicella or measles","MERS-CoV (suspected or confirmed)"]],
  ["Other",["Other"]]];
const ISO_PREC={"C. difficile":["Contact plus (C. difficile)"],"Influenza":["Droplet"],"COVID-19":["Droplet","Contact"],
  "Tuberculosis (suspected or confirmed)":["Airborne"],"Varicella or measles":["Airborne","Contact"],"MERS-CoV (suspected or confirmed)":["Airborne","Contact"],"Other":[]};

const ISO_CHECKS=[["sign","Precaution sign on the door"],["ppe","PPE available at the door"],["room","Single room or cohort"],["equip","Dedicated equipment"]];
const isoOk=x=>ISO_CHECKS.every(([k])=>x[k]==="Yes");

      <div class="card iso"><div class="iso-h"><b>Bed ${esc(x.bed)}</b><span>${(x.precautions||[]).map(p=>`<span class="tag ${p==="Airborne"?"no":"mid"}">${p}</span>`).join(" ")}</span></div>

/* CLSI M39: first isolate of each species per patient in the period; percent susceptible counts S only; flag fewer than 30 isolates. */
const SIR=v=>{const t=String(v??"").trim().toUpperCase();return /^S/.test(t)?"S":/^I|^SDD/.test(t)?"I":/^R/.test(t)?"R":"";};
function abgData(year,spec){
  const rows=S.ast.filter(r=>r.date.startsWith(year)&&(spec==="all"||r.specimen===spec)).sort((a,b)=>a.date.localeCompare(b.date));
  const seen=new Set(),first=[];rows.forEach(r=>{const k=(r.mrn||r.id)+"|"+orgKey(r.organism);if(!seen.has(k)){seen.add(k);first.push(r);}});
  const orgs={};first.forEach(r=>{const o=r.organism.trim();(orgs[o]=orgs[o]||[]).push(r);});
  const abx=[...new Set(first.flatMap(r=>Object.keys(r.res||{})))].sort();
  return{orgs:Object.entries(orgs).sort((a,b)=>b[1].length-a[1].length),abx,n:first.length};
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const [name,data] of files){const nm=te.encode(name),c=crc32(data);
    const lh=new Uint8Array([0x50,0x4B,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,data);
    cen.push(new Uint8Array([0x50,0x4B,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+data.length;}
  const cl=cen.reduce((a,x)=>a+x.length,0);
  return new Blob([...parts,...cen,new Uint8Array([0x50,0x4B,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cl),...u32(off),0,0])],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
const xesc=v=>String(v).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").slice(0,32000);

  const cell=(v,r,c,hd)=>{const ref=colL(c)+(r+1);if(v===null||v===undefined||v==="")return "";
    if(typeof v==="number"&&isFinite(v))return `<c r="${ref}"${hd?' s="1"':""}><v>${v}</v></c>`;

      else out[key]=typeof v==="string"?(/^data:image/.test(v)?"(image)":fd(v)):v;}return out;};

  Object.keys(TRACK).forEach(k=>{SNAP[k]=snapOf(mem[k]??({"ipc-risk":S.risk,"ipc-outbreaks":S.outbreaks,"ipc-iso":S.iso,"ipc-expo":S.expo,"ipc-fit":S.fit,"ipc-train":S.train,"ipc-notify":S.notify,"ipc-sched":S.sched,"ipc-ast":S.ast,"ipc-audits":S.audits,"ipc-actions":S.actions,"ipc-patients":S.patients,"ipc-devices":S.devices,"ipc-events":S.events,"ipc-users":S.users,"ipc-mdro":S.mdro,"ipc-surg":S.surg})[k]);});
  if("serviceWorker" in navigator&&location.protocol==="https:"&&!window.storage){navigator.serviceWorker.register("sw.js").catch(()=>{});}
  const sess=await sget("ipc-session"),u=S.users.find(x=>x.username===sess);
  if(u){S.user=sessUser(u);S.view="home";setTimeout(autoActions,500);}
  else S.view="login";
  render();
})();
</script>
